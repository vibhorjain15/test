<!DOCTYPE html>
<html ng-app="diligenceVault" lang="en">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport">
    <title>DiligenceVault</title>

    <link rel="apple-touch-icon" sizes="57x57" href="/static/ico/apple-touch-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/static/ico/apple-touch-icon-60x60.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/static/ico/apple-touch-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/static/ico/apple-touch-icon-76x76.png" />
    <link rel="icon" type="image/png" href="/static/ico/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/static/ico/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/static/ico/favicon-16x16.png" sizes="16x16" />
    <link rel="manifest" href="/static/ico/android-chrome-manifest.json" />
    <link rel="shortcut icon" href="/static/ico/favicon.ico" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-config" content="/static/ico/browserconfig.xml" />
    <meta name="theme-color" content="#ffffff" />

    <style>
        body{
            background-color: #f5f7fa;
        }
        .container{
            margin: 7% auto 0;
            max-width: 900px;
            min-height: 180px;
            padding: 30px 0 15px;
        }

        img.logo{
            width: 300px;
            height: auto;
        }
        .errorMessage{
            width: 600px;
            color: #126b82;
            position: absolute;
            margin-top: 100px;
        }

        @media only screen and (min-device-width : 320px) and (max-device-width : 480px)  {
            .container{
                margin: 7% auto 0;
                max-width: 300px;
                min-height: 180px;
                padding: 30px 0 15px;
            }

            img.logo{
                width: 300px;
                height: auto;
                align-items: center;
            }
            .errorMessage{
                width: 300px;
                color: #126b82;
                position: relative;
                margin-top: 10px;
                display: block;
                text-align: center;
            }
        }

        @media only screen and (min-device-width : 768px) and (max-device-width : 1024px){
            .container{
                margin: 7% auto 0;
                max-width: 700px;
                min-height: 180px;
                padding: 30px 0 15px;
            }

            img.logo{
                width: 300px;
                height: auto;
                align-items: center;
            }
            .errorMessage{
                width: 300px;
                color: #126b82;
                position: absolute;
                margin-top: 100px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img class="logo" src="/static/images/DV_logo.png" alt="DV Logo">
        <span class="errorMessage">The page you are looking for couldnot be found on this server</span>
    </div>
</body>
</html>
