<div class="form-group space-on-top">
  <dv-select
    class="dropdown-filter-caret"
    [appendTo]="'body'"
    (onSelectChange)="onFilterChange($event)"
    [(ngModel)]="currentValue"
    [clearable]="!!currentValue"
    onkeypress="{return false;}"
    [list]="selectOptions"
    [bindValue]="'value'"
    [bindLabel]="'label'"
    [aria-label]="'Select Resource Type'"
  >
  </dv-select>
</div>
