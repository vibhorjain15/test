<div class="panel panel-default">
  <div class="panel-heading">
    <span>
      <span appIcon name="calendar" class="space-on-right align-middle"></span>
      <span class="align-middle">
        Meetings
        <span *ngIf="meetings.length"> ({{ meetings.length }}) </span>
      </span>
    </span>
    <div class="panel-controls">
      <div class="panel-controls-wrapper">
        <a
          class="panel-control"
          (click)="addMeeting()"
          tooltip="Add New Meeting"
          container="body"
        >
          <span appIcon name="plus"></span>
        </a>
      </div>
    </div>
  </div>
  <div class="panel-body" *ngIf="!meetings">
    <app-spinner [broadSpinner]="true" [spinnerHeight]="60"></app-spinner>
  </div>
  <div class="panel-body" *ngIf="meetings && meetings.length == 0">
    <app-empty-state message="There are no meetings!"></app-empty-state>
  </div>
  <div
    class="panel-body has-notes-form clear-padding"
    *ngIf="meetings && meetings.length > 0"
  >
    <ul class="list-group clear-margin-bottom tasks-list">
      <li
        class="list-group-item pa-tb-xl pa-lr-xxl task-item"
        *ngFor="let meeting of meetings"
      >
        <div class="media">
          <div class="media-body">
            <div class="dv-table full-width">
              <div class="cell align-middle">
                <span *ngIf="meeting.event_start_at">
                  <small class="text-muted">
                    <a
                      (click)="navigateToMeetingsDetail(meeting.id)"
                      class="clickable"
                      >{{ meeting.name }}</a
                    >
                    on
                    {{
                      getMeetingsDate(meeting.event_start_at)
                        | dvDate : ["isLocaleDate"]
                    }}</small
                  >
                </span>
                <span class="pull-right">
                  <small
                    class="text-muted v-align-text-top space-on-right"
                    tooltip="Edit this meeting"
                    container="body"
                  >
                    <a
                      class="link-disguise clickable"
                      (click)="editMeeting(meeting)"
                      >edit</a
                    >
                  </small>
                </span>
              </div>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
