<div class="panel panel-default">
  <div class="panel-heading">
    <span>
      <span appIcon name="tasks" class="space-on-right align-middle"></span>
      <span class="align-middle">
        Open Tasks / Reminders
        <span *ngIf="tasks.length"> ({{ tasks.length }}) </span>
      </span>
    </span>
    <div class="panel-controls">
      <div class="panel-controls-wrapper">
        <a
          class="panel-control"
          (click)="addTask()"
          placement="left"
          tooltip="Add New Task"
          container="body"
          clickable
        >
          <span appIcon name="plus"></span>
        </a>
      </div>
    </div>
  </div>
  <div class="panel-body" *ngIf="!tasks">
    <app-spinner [broadSpinner]="true" [spinnerHeight]="60"></app-spinner>
  </div>
  <div class="panel-body" *ngIf="tasks && tasks.length == 0">
    <app-empty-state
      message="There are no open tasks present!"
    ></app-empty-state>
  </div>
  <div
    class="panel-body has-notes-form clear-padding"
    *ngIf="tasks && tasks.length > 0"
  >
    <ul class="list-group clear-margin-bottom tasks-list">
      <li
        class="list-group-item pa-tb-xl pa-lr-xxl task-item"
        *ngFor="let task of tasks; let $index = index"
      >
        <div class="media">
          <div class="media-left padded-top">
            <span class="circled-initials clear-margin-left">
              {{ $index + 1 }}
            </span>
          </div>
          <div class="media-body">
            <div class="dv-table full-width">
              <div class="cell align-middle">
                <span *ngIf="task.due_date">
                  <small class="text-muted"
                    >Due {{ task.due_date | dvDate : ["isLocaleDate"] }}</small
                  >
                </span>
                <span
                  tooltip="Assigned to"
                  container="body"
                  placement="left"
                  class="space-on-right-lg label text-uppercase label-default"
                  *ngIf="task.assigned_to_member"
                >
                  <small>{{ task.assigned_to_member }}</small>
                </span>
                <button
                  tooltip="Mark as complete"
                  container="body"
                  appButton
                  btnType="default"
                  (click)="markTaskAsComplete(task)"
                  class="primary pull-right space-on-right space-on-top"
                  size="xs"
                  *ngIf="!task.is_complete"
                  [attr.aria-label]="'Mark as complete'"
                >
                  <span appIcon name="check"></span>
                </button>
                <span
                  tooltip="Completed"
                  container="body"
                  appIcon
                  placement="left"
                  name="check"
                  class="text-primary pull-right space-on-right-lg space-on-top-lg"
                  *ngIf="task.is_complete"
                ></span>
                <p
                  *ngIf="!task.is_complete"
                  class="space-on-bottom space-on-top"
                >
                  <span
                    class="word-break-break-all"
                    [innerHtml]="task.text"
                  ></span>
                </p>
                <p
                  *ngIf="task.is_complete"
                  class="space-on-bottom space-on-top text-striken"
                >
                  <span
                    class="word-break-break-all"
                    [innerHtml]="task.text"
                  ></span>
                </p>
                <span class="pull-left" *ngIf="!task.is_complete">
                  <small
                    class="text-muted v-align-text-top space-on-right"
                    tooltip="Edit this task"
                    container="body"
                  >
                    <a
                      class="link-disguise clickable"
                      (click)="editTask(task)"
                      clickable
                      tooltip="edit"
                      >edit</a
                    >
                  </small>
                  <small class="text-muted v-align-text-top">
                    <a
                      class="link-disguise clickable"
                      (click)="confirmDeleteTask(task)"
                      tooltip="Delete this task"
                      placement="left"
                      container="body"
                      clickable
                      >delete</a
                    >
                  </small>
                </span>
              </div>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
