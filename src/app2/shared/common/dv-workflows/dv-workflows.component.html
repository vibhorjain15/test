<div class="panel panel-default">
  <div class="panel-heading">
    <span>
      <span appIcon name="cogs" class="space-on-right align-middle"></span>
      <span class="align-middle">
        Workflow Process
        <span *ngIf="workflows.length"> ({{ workflows.length }}) </span>
      </span>
    </span>
    <div class="panel-controls" *ngIf="!insertDisabled">
      <div class="panel-controls-wrapper">
        <a
          class="panel-control"
          (click)="addWorkflow()"
          tooltip="Start Workflow Process"
          placement="left"
          container="body"
          clickable
        >
          <span appIcon name="plus"></span>
        </a>
      </div>
    </div>
  </div>
  <div class="panel-body" *ngIf="!workflows">
    <app-spinner [broadSpinner]="true" [spinnerHeight]="60"></app-spinner>
  </div>
  <div class="panel-body" *ngIf="workflows && workflows.length === 0">
    <app-empty-state message="There are no workflows"></app-empty-state>
  </div>
  <div
    class="panel-body has-notes-form clear-padding"
    *ngIf="workflows && workflows.length > 0"
  >
    <table class="table workflows_table">
      <tbody>
        <tr *ngFor="let workflow of workflows">
          <td>
            <a (click)="navigateToWorkflowDetail(workflow.id)">
              {{ workflow.name }}
            </a>
          </td>
          <td>
            <small class="text-muted">
              as of
              {{
                (workflow.updated_at
                  ? workflow.updated_at
                  : workflow.created_at
                ) | dvDate
              }}
            </small>
          </td>
          <td>
            <dv-progress-bar [value]="workflow.pct_complete" type="success">
            </dv-progress-bar>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
