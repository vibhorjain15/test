<div class="space-on-top-lg">
  <div class="list-group-item" *ngIf="loading_data">
    <div class="row clearfix">
      <div>
        <app-spinner [broadSpinner]="true" [spinnerHeight]="20"></app-spinner>
      </div>
    </div>
  </div>

  <div
    class="list-group-item"
    *ngIf="!loading_data"
    [tooltip]="
      disabled
        ? 'Please contact customer service in order to enable this feature for your firm'
        : ''
    "
  >
    <div *ngIf="!teams || teams.length == 0">
      <p class="clear-margin text-center">
        No teams present,
        <a class="clickable" (click)="redirectToTeamsGrid()">click here</a>
        to add one
      </p>
    </div>
    <div *ngIf="teams.length > 0">
      <form [formGroup]="teamsForm" autocomplete="off">
        <div col="12" *ngIf="type == 'Resource'">
          <dv-form-element
            fieldName="Permission Mode"
            [showRightIcon]="false"
            label="Permission Mode"
            labelPosition="top"
            elementCol="5"
            [for]="'permissionMode'"
          >
            <dv-select
              [list]="permissionTypes"
              [clearable]="false"
              [disabled]="disabled"
              [(ngModel)]="selectedPermissionType"
              [ngModelOptions]="{ standalone: true }"
              placeholder="Select an Option"
              (onSelectChange)="onPermissionTypeChange($event)"
              [id]="'permissionMode'"
              [aria-label]="'Select an Option'"
            ></dv-select>
          </dv-form-element>
        </div>
        <div formArrayName="permissions">
          <div
            *ngFor="let team of permissions.controls; let i = index"
            class="space-on-top-lg"
          >
            <div class="row" [formGroupName]="i">
              <div col="5" class="space-on-left space-on-right">
                <dv-form-element
                  [fieldName]="'Team'"
                  [modelController]="
                    permissions.controls[i].get('assigned_to_entity_id')
                  "
                  [showRightIcon]="false"
                  [label]="i == 0 ? 'Team' : ''"
                  labelPosition="top"
                  elementCol="12"
                  [errorMessage]="
                    permissions.controls[i].get('assigned_to_entity_id')
                      .touched &&
                    permissions.controls[i].get('assigned_to_entity_id').errors
                      ?.required
                      ? 'Team is required'
                      : ''
                  "
                  [for]="'assigned_to_entity_id'+ i"
                >
                  <dv-select
                    [list]="dropdown_teams"
                    formControlName="assigned_to_entity_id"
                    (onSelectChange)="
                      handleSelectChange(
                        $event,
                        permissions.controls[i].get('assigned_to_entity_id')
                      )
                    "
                    bindLabel="name"
                    bindValue="id"
                    [clearable]="false"
                    [searchable]="true"
                    [readonly]="disabled || disableAssignmentDetails"
                    [contoller]="
                      permissions.controls[i].get('assigned_to_entity_id')
                    "
                    [aria-label]="'Team'"
                    [id]="'assigned_to_entity_id'+ i"
                  >
                  </dv-select>
                </dv-form-element>
              </div>
              <div
                col="5"
                *ngIf="type == 'User' || disableAssignmentDetails"
                class="space-on-left space-on-right"
              >
                <dv-form-element
                  [fieldName]="'Access level'"
                  [modelController]="
                    permissions.controls[i].get('access_level')
                  "
                  [showRightIcon]="false"
                  [label]="i == 0 ? 'Access level' : ''"
                  labelPosition="top"
                  [elementCol]="12"
                  [elementClass]="'padding-0'"
                  [errorMessage]="
                    permissions.controls[i].get('access_level').touched &&
                    permissions.controls[i].get('access_level').errors?.required
                      ? 'Access level is required'
                      : ''
                  "
                >
                  <dv-select
                    [list]="roles"
                    formControlName="access_level"
                    [contoller]="permissions.controls[i].get('access_level')"
                    (onSelectChange)="
                      handleSelectChange(
                        $event,
                        permissions.controls[i].get('access_level')
                      )
                    "
                    [readonly]="disabled"
                    bindLabel="alias"
                    bindValue="id"
                    [clearable]="false"
                    [searchable]="true"
                    [placeholder]="'Select an Option'"
                    [aria-label]="'Access level'"
                    [id]="'access_level'"
                  ></dv-select>
                </dv-form-element>
              </div>
              <div
                col="5"
                *ngIf="type == 'Resource' && !disableAssignmentDetails"
                class="space-on-left space-on-right"
              >
                <dv-form-element
                  [fieldName]="'Visibility'"
                  [modelController]="
                    permissions.controls[i].get('access_level')
                  "
                  [showRightIcon]="false"
                  [elementCol]="12"
                  [elementClass]="'padding-0'"
                  [errorMessage]="
                    permissions.controls[i].get('access_level').touched &&
                    permissions.controls[i].get('access_level').errors?.required
                      ? 'Visibility is required'
                      : ''
                  "
                  [label]="i == 0 ? 'Visibility' : ''"
                  labelPosition="top"
                >
                  <dv-select
                    [list]="accessList"
                    formControlName="access_level"
                    (onSelectChange)="triggerValidations(i)"
                    bindLabel="alias"
                    bindValue="name"
                    [clearable]="false"
                    [searchable]="true"
                    [aria-label]="'Visibility'"
                    [id]="'access_level'"
                  >
                  </dv-select>
                </dv-form-element>
              </div>
              <div
                col="1"
                [ngClass]="{ 'padding-top-20 space-on-top-xl': i === 0 }"
              >
                <dv-button
                  [btnType]="'transparent'"
                  [btnClass]="'delete-control'"
                  (onClick)="removeControl(i)"
                  tooltipText="Remove access"
                  [disabled]="disabled"
                >
                  <span appIcon name="trashcan"></span>
                </dv-button>
              </div>
            </div>
          </div>
        </div>
      </form>
      <div class="row">
        <div col="12">
          <span col="2" offset="10" class="padded-left">
            <dv-button
              [disabled]="disabled || disableAssignmentDetails"
              [btnType]="'default'"
              [btnClass]="'center-block'"
              [size]="'sm'"
              (onClick)="addNewControl()"
              tooltipText="Add access"
            >
              <span appIcon name="plus"></span>
            </dv-button>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
