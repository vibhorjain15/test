<div class="panel panel-default borderless-top">
  <div class="panel-body clearfix">
    <app-spinner
      [broadSpinner]="true"
      spinnerHeight="40"
      *ngIf="!fund"
    ></app-spinner>
    <div class="dv-table dv-table-middle dd-info-panel" *ngIf="fund">
      <div class="cell">
        <h4 class="clear-margin max-w-320 lh1-5 word-break-break-all">
          {{ fund.display_name }}
          <span
            class="space-on-left label label-warning"
            tooltip="Deactivated by the owner firm"
            container="body"
            *ngIf="!fund.platform_active"
            >{{ statusLabel.INACTIVE }}</span
          >
        </h4>
        <p class="text-muted space-on-top" *ngIf="fund.parentFirm.name">
          <small>Parent Firm: </small>
          <small>
            <a (click)="navigateToMonitor()" class="clickable"
              ><strong>{{ fund.parentFirm.name }}</strong></a
            >
          </small>
        </p>
      </div>
      <div class="cell bordered-left">
        <a (click)="navigateToInvestments()" class="btn btn-transparent">
          <div><span appIcon name="arrow-back" size="2x"></span></div>
          <small> Back to all Products </small>
        </a>
      </div>
    </div>
  </div>
</div>

<app-spinner
  broadSpinner="true"
  spinnerHeight="65"
  *ngIf="!fundId"
></app-spinner>
<dv-recommendations
  *ngIf="fundId"
  [entity_id]="fundId"
  [entity_type]="entity_type"
></dv-recommendations>
