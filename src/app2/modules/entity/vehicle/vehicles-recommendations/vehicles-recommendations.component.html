<div class="panel panel-default borderless-top">
  <div class="panel-body clearfix">
    <app-spinner
      [broadSpinner]="true"
      spinnerHeight="40"
      *ngIf="!vehicle"
    ></app-spinner>
    <div class="dv-table dv-table-middle dd-info-panel" *ngIf="vehicle">
      <div class="cell">
        <h4 class="clear-margin max-w-320 lh1-5 word-break-break-all">
          {{ vehicle?.display_name }}
          <span
            class="space-on-left label label-warning"
            tooltip="Deactivated by the owner firm"
            container="body"
            *ngIf="!vehicle.platform_active"
            >{{ statusLabel.INACTIVE }}</span
          >
        </h4>
        <p class="text-muted space-on-top" *ngIf="vehicle?.fund_name">
          <small>Parent Product: &nbsp;</small>
          <small *ngIf="!is_manager">
            <a (click)="navigateToProfileMonitor()" class="clickable"
              ><strong>{{ vehicle?.fund_name }}</strong></a
            >
          </small>
          <small *ngIf="is_manager">
            <a (click)="navigateToProfileAumTr()"
              ><strong>{{ vehicle?.fund_name }}</strong></a
            >
          </small>
        </p>
      </div>
      <div class="cell bordered-left">
        <a class="btn btn-transparent" (click)="navigateToVehicles()">
          <div>
            <span appIcon name="arrow-back" size="2x"></span>
          </div>
          <small>Back to all Vehicles</small>
        </a>
      </div>
    </div>
  </div>
</div>

<app-spinner
  broadSpinner="true"
  spinnerHeight="65"
  *ngIf="!vehicleId"
></app-spinner>
<dv-recommendations
  *ngIf="vehicleId"
  [entity_id]="vehicleId"
  [entity_type]="entity_type"
></dv-recommendations>
