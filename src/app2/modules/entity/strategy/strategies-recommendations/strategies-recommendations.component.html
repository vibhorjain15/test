<div class="panel panel-default borderless-top">
  <div class="panel-body clearfix">
    <app-spinner
      [broadSpinner]="true"
      [spinnerHeight]="40"
      *ngIf="!strategy"
    ></app-spinner>
    <div class="dv-table dv-table-middle dd-info-panel" *ngIf="strategy">
      <div class="bordered-right cell">
        <h4 class="clear-margin max-w-320 lh1-5 word-break-break-all">
          {{ strategy?.display_name }}
          <span
            class="space-on-left label label-warning"
            tooltip="Deactivated by the owner firm"
            container="body"
            *ngIf="!strategy?.platform_active"
            >{{ statusLabel.INACTIVE }}</span
          >
        </h4>
        <p class="text-muted space-on-top" *ngIf="strategy?.parentFirm.name">
          <small>Parent Firm: &nbsp;</small>
          <small>
            <a (click)="navigateToProfileMonitor()" class="clickable"
              ><strong>{{ strategy?.parentFirm.name }}</strong></a
            >
          </small>
        </p>
      </div>
      <div class="cell bordered-left">
        <a class="btn btn-transparent" (click)="navigateToStrategies()">
          <div>
            <span appIcon name="arrow-back" size="2x"></span>
          </div>
          <small>Back to all Strategies</small>
        </a>
      </div>
    </div>
  </div>
</div>

<app-spinner
  broadSpinner="true"
  spinnerHeight="65"
  *ngIf="!entity_id"
></app-spinner>
<dv-recommendations
  *ngIf="entity_id"
  [entity_id]="entity_id"
  [entity_type]="entity_type"
></dv-recommendations>
