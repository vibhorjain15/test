<div class="panel panel-default">
  <div class="panel-heading">
    <h5 class="panel-title">
      {{ modalTitle ? modalTitle : "Internal DDQs" }}
    </h5>
    <div class="panel-controls">
      <div class="panel-controls-wrapper" *ngIf="!readonly">
        <a
          class="panel-control"
          (click)="openModal()"
          [ngClass]="{ disabled: isFreeSubscription }"
          tooltip="{{
            isFreeSubscription
              ? 'Only available in premium subscription'
              : createNewTooltip
          }}"
          container="body"
        >
          <span appIcon name="plus"></span> Create New Project
        </a>
      </div>
    </div>
  </div>
  <div class="panel-body" *ngIf="!ddqs || !ddqs?.length">
    <app-spinner class="justify-center" *ngIf="!ddqs"></app-spinner>
    <app-empty-state
      iconName="search"
      *ngIf="ddqs && !ddqs?.length"
      [message]="empty_state_message"
    >
    </app-empty-state>
  </div>
  <ul
    class="list-group"
    tabindex="0"
    [ngClass]="{ 'scroll-body': ddqs?.length > 5 }"
  >
    <li class="list-group-item" *ngFor="let ddq of ddqs">
      <div class="space-on-bottom-lg">
        <a
          class="clickable"
          [attr.href]="ddq.url"
        >
          {{
            ddqType === "investor"
              ? ddq.tofirm_name + " - " + ddq.name
              : ddq.name
          }}
        </a>
        <br />
        <small class="text-muted" *ngIf="ddq.closed_at">
          Updated on {{ ddq.closed_at | dvDate }}
        </small>
      </div>
      <div class="space-on-bottom-lg">
        <dv-progress-bar
          [value]="ddq.percentage_completed"
          type="success"
          suffix="% Complete"
        >
        </dv-progress-bar>
      </div>
      <div class="clearfix">
        <div class="pull-right">
          <dv-button
            [fontSizeType]="'medium'"
            [btnType]="'default'"
            *ngIf="!readonly && ddq.completed_at && is_manager"
            [btnClass]="'space-on-left'"
            [size]="'xs'"
            tooltipText="Share with Investor"
            (onClick)="shareDDQ(ddq)"
          >
            <span appIcon name="share"></span>
          </dv-button>
          <dv-button
            *ngIf="!(readonly || ddqType === 'investor')"
            [fontSizeType]="'medium'"
            [btnType]="'default'"
            [btnClass]="'space-on-left'"
            [size]="'xs'"
            tooltipText="Create a New Version"
            triggers="mouseenter:mouseleave"
            (onClick)="createNewVersion(ddq)"
          >
            <span appIcon name="plus"></span>
          </dv-button>
          <dv-button
            *ngIf="!(readonly || ddqType === 'investor')"
            [fontSizeType]="'medium'"
            [btnType]="'default'"
            [btnClass]="'space-on-left text-danger'"
            [size]="'xs'"
            tooltipText="Retire this DDQ"
            triggers="mouseenter:mouseleave"
            (onClick)="retireDDQ(ddq)"
          >
            <span appIcon name="ban"></span>
          </dv-button>
        </div>
      </div>
    </li>
  </ul>
</div>
