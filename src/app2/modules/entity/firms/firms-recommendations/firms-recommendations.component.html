<div class="panel panel-default borderless-top hide-in-print-view">
  <div class="panel-body clearfix">
    <app-spinner
      broadSpinner="true"
      spinnerHeight="65"
      *ngIf="!firm"
    ></app-spinner>
    <div class="dv-table dv-table-middle dd-info-panel" *ngIf="firm">
      <div class="bordered-right cell">
        <h4 class="clear-margin max-w-320 lh1-5 word-break-break-all">
          {{ firm?.display_name }}
        </h4>
      </div>
      <div class="cell bordered-left">
        <a class="btn btn-transparent" (click)="navigateToFirms()">
          <div>
            <span appIcon name="arrow-back" size="2x"></span>
          </div>
          <small>Back to all Firms</small>
        </a>
      </div>
    </div>
  </div>
</div>
<app-spinner
  broadSpinner="true"
  spinnerHeight="65"
  *ngIf="!entity_id"
></app-spinner>
<dv-recommendations
  [entity_id]="entity_id"
  [entity_type]="entity_type"
  *ngIf="entity_id"
></dv-recommendations>
