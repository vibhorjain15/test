<div>
  <div class="panel panel-default">
    <div class="panel-body">
      <app-spinner
        [broadSpinner]="true"
        [spinnerHeight]="560"
        *ngIf="!loading_grid"
      ></app-spinner>

      <div class="dv-table dv-table-middle dd-info-panel" *ngIf="loading_grid">
        <div class="bordered-right cell">
          <h4 class="clear-margin max-w-320 lh1-5 word-break-break-all">
            {{ formadv_firm.businessName }}
          </h4>

          <small class="text-muted">
            Latest Filing:
            {{ formadv_firm.filingDate | dvDate : ["isLocaleDate"] }}
          </small>
        </div>
      </div>
    </div>
  </div>

  <div class="panel panel-default">
    <div class="panel-body padded-xxxl">
      <span *ngIf="displayFlags">
        <app-spinner
          [broadSpinner]="true"
          [spinnerHeight]="75"
          *ngIf="!loading_grid"
        ></app-spinner>

        <span *ngIf="flags && flags.length > 0 && displayFlags">
          <div col="12" class="pa-lr-xxl">
            <div col="12" class="space-on-top-lg padded-bottom-xl">
              <div col="9">
                <div col="11" offset="1">
                  <span class="control-label fw-bolder">Question</span>
                </div>
              </div>
              <div col="2" class="text-center">
                <span class="control-label fw-bolder">Response</span>
              </div>
              <div col="1" class="text-center">
                <span class="control-label fw-bolder">% of Total</span>
              </div>
            </div>
          </div>

          <div
            col="12"
            *ngFor="
              let group of grouped_flags | keyvalue : keyValuePipeDefaultOrder
            "
          >
            <div class="panel panel-default">
              <div class="panel-heading">
                <h5 class="panel-title">{{ group.key }}</h5>
              </div>
              <div class="panel-body">
                <div
                  col="12"
                  class="pa-tb-lg threshold-item"
                  *ngFor="let flag of group.value; index as i"
                >
                  <div col="9">
                    <h5 class="text-center inline-block" col="1">
                      <span class="space-on-right-lg">{{ i + 1 }}.</span>
                    </h5>
                    <h5 col="11" class="lh1-5 space-on-top">{{ flag.text }}</h5>
                  </div>
                  <div col="2" class="text-center">
                    <h5>
                      <span class="space-on-right-lg">{{ flag.value }}</span>
                    </h5>
                  </div>
                  <div col="1" class="text-center">
                    <div
                      appDdScore
                      [score]="flag.percentile"
                      show-total="true"
                      keep-watcher-on="true"
                      total="100"
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </span>

        <app-empty-state
          appIcon
          iconName="smile-o"
          col="6"
          offset="3"
          message="Our algorithm came back empty. No flags found for {{
            formadv_firm.businessName
          }}."
          *ngIf="flags.length == 0"
        ></app-empty-state>
      </span>

      <app-empty-state
        appIcon
        iconName="smile-o"
        col="6"
        offset="3"
        message="Potential flags for {{
          formadv_firm.businessName
        }} available for analytics subscribers. To learn more, or to unlock this analysis, please get in touch with us at subscriptions@diligencevault.com"
        *ngIf="displayFlags.length > 0"
      ></app-empty-state>
    </div>
  </div>
</div>
