<div class="question-wrapper" role="list" aria-label="Questions">
  <question-container
    *ngFor="let question of questionList; let i = index"
    [question]="question"
    [index]="i"
    (selectedChange)="handleSelection()"
    [rightIconList]="question.rightIcons"
    (onActionButtonClick)="handleRightIconClick($event)"
    role="listitem"
    [attr.tabindex]="i === 0 ? 0 : -1"
    [attr.aria-posinset]="i + 1"
    [attr.aria-setsize]="questionList.length"
    [attr.aria-selected]="question.isSelected"
  ></question-container>
</div>
