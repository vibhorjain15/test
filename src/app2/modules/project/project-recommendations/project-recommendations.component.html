<div class="panel panel-default">
  <div class="panel-body clearfix">
    <app-spinner
      [broadSpinner]="true"
      [spinnerHeight]="40"
      *ngIf="!diligence"
      aria-live="polite"
      aria-busy="true"
    ></app-spinner>

    <div class="dv-table dv-table-middle dd-info-panel" *ngIf="diligence">
      <div class="bordered-right cell">
        <h4
          class="clear-margin max-w-320 lh1-5 word-break-break-all"
          id="diligence-heading"
        >
          {{ diligence.entity_name }}
        </h4>
        <div>
          <small class="text-muted" *ngIf="diligence.last_updated_at">
            Last updated
            {{ diligence.last_updated_at | dvDate }}
          </small>
        </div>
      </div>

      <div class="text-center cell">
        <span class="align-middle display-block">Status</span>
        <span diligenceStatus [status]="diligence.status"></span>
      </div>
    </div>
  </div>
</div>

<dv-recommendations
  [entity_id]="diligenceId"
  [entity_type]="entity_type"
  [diligence]="diligence"
  *ngIf="diligence"
></dv-recommendations>
