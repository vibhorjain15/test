<div class="panel panel-default">
  <div class="panel-heading">
    <h5 class="panel-title">Account Activity</h5>
  </div>
  <div class="panel-body">
    <app-spinner *ngIf="!sessions"></app-spinner>
    <ul
      class="list-unstyled clear-margin-bottom list-bordered-bottom"
      *ngIf="sessions"
      tabindex="0"
    >
      <li *ngFor="let session of sessions" tabindex="0">
        <dl class="dl-horizontal clear-margin-bottom">
          <dt>Last Accessed</dt>
          <dd>
            <b>{{
              session.loginTime | date : "MMM dd, yyyy 'at' hh:mm a Z"
            }}</b>
          </dd>
          <dt>IP Address:</dt>
          <dd>{{ session.ipAddress }}</dd>
        </dl>
      </li>
    </ul>
    <helper-text *ngIf="sessions && !sessions.length">
      No Session Information is available
    </helper-text>
  </div>
</div>
