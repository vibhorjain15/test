<div class="container">
  <div class="row clearfix">
    <div class="authentication-form-wrapper">
      <div class="logo-wrapper">
        <img src="/assets/images/logo.png" alt="logo" class="logo" />
      </div>

      <app-spinner *ngIf="verifyingToken"></app-spinner>

      <p
        class="alert alert-danger clear-margin"
        *ngIf="!verifyingToken && invalidToken"
      >
        Your token has expired! Please request a new one by clicking
        <a (click)="redirectToForgetPasswordPage()">here</a>
      </p>

      <div>
        <dv-password
          *ngIf="!verifyingToken && !invalidToken"
          placeholder="New Password"
          [keepSpacing]="false"
          [twoColumnLayout]="false"
          (onSubmit)="resetPassword()"
          #password
        ></dv-password>
      </div>
      <br /><br />
      <div>
        <dv-button
          btnWidth="100"
          btnClass="activate-btn"
          [loader]="loading"
          [disabled]="!passwordComponent?.isPasswordValid()"
          (onClick)="resetPassword()"
          *ngIf="!verifyingToken && !invalidToken"
        >
          Reset Password
        </dv-button>
      </div>
    </div>
  </div>
</div>
