<div class="panel panel-default">
  <div class="panel-heading">
    <h5 class="panel-title text-bold">Upload Your Data into DiligenceVault</h5>
  </div>
  <div class="panel-info">
    <div class="panel-heading">
      <span class="block-display"
        >Download an empty Excel template to add your Q/A Library content by
        clicking
        <a
          class="clickable link-underline"
          (click)="downloadEmptySampleFile()"
          tabindex="0"
          role="button"
          aria-label="Download Excel file with all of your existing Q/A library content"
        >
          here
        </a>
      </span>
      <span class="block-display">
        Download Excel file with all your existing data related to Q/A Library
        content by clicking
        <a
          class="clickable link-underline"
          (click)="downloadSampleFile()"
          tabindex="0"
          role="button"
          aria-label="Download Excel file with all your existing data related to Q/A Library content"
        >
          here
        </a>
      </span>
    </div>
  </div>
  <div class="panel-body">
    <div>
      <div class="dd-doc-selection-wrapper">
        <dv-uploader
          [accept]="allowed_file_extensions_str"
          dragLabel="Drag & Drop your bulk upload Excel here"
          [isMultiple]="false"
          (onFileUpload)="dropped($event)"
        ></dv-uploader>
      </div>
    </div>
    <div class="form-group text-center space-on-top-lg">
      <dv-button
        [loader]="uploading_excel"
        [btnClass]="'minWidth'"
        [btnType]="'primary'"
        (onClick)="addDocumentSubmit()"
        ariaLabel="Process Upload"
      >
        Process Upload
      </dv-button>
    </div>
  </div>
</div>
