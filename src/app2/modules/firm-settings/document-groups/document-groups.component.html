<div class="panel panel-default">

    <h5 class="panel-title">Document Types</h5>

    <div class="panel-heading">
      Manage all Document types that are relevant to your organization under
      this section.

      <app-tags-manager

        [tagLabel]="'type'"
      ></app-tags-manager>
    </div>
  </div>
</div>
