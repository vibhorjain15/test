<div class="panel panel-default">
  <div class="panel-heading">
    <h5 class="panel-title">Manage Strategy Tags and Custom Fields</h5>
  </div>
  <div class="panel-info">
    <div class="panel-heading">
      Manage all strategy tags and custom fields that are relevant to your
      organization under this section.
    </div>
  </div>
  <div class="panel-body">
    <app-spinner
      [broadSpinner]="true"
      [spinnerHeight]="60"
      *ngIf="loading"
      aria-hidden="true"
    ></app-spinner>
    <div *ngIf="!loading">
      <div>
        <app-custom-field-viewer
          [entityType]="'strategy'"
          [entityTypeId]="5004"
          [source]="'strategy'"
        >
        </app-custom-field-viewer>
      </div>
    </div>
  </div>
</div>
