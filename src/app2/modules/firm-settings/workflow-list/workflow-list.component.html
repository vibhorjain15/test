<div class="panel panel-default">

    heading="Workflow Definitions"
    [controls]="panelHeadingControls"
  ></dv-panel-heading>
  <div class="panel-body">
    <app-dv-grid
      [rowData]="workflows"

      [onCellClicked]="onCellClicked"
    ></app-dv-grid>
  </div>
</div>
