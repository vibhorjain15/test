<div class="row">
  <!-- First row with the title section and graphs   -->
  <div class="col-sm-12">
    <!-- Activity title and graphs column -->
    <div class="row clearfix">
      <!-- Title row -->
      <div col="8">
        <div class="panel panel-default">
          <div class="panel-body text-muted">
            <div class="space-on-top" col="5">
              My, you've been ACTIVE! Platform Activity from
            </div>
            <div
              col="6"
              class="w-280 col-md-6 pull-right space-on-top space-on-right"
            >
              <app-date-range-picker
                [customDate]="dateRangeRatingScheme"
                (change)="onChange($event)"
                *ngIf="customDateFilter"
                (clearDateFilter)="onClearDateFilter()"
              ></app-date-range-picker>
            </div>
          </div>
        </div>
      </div>
      <!-- Docs Columns  -->
      <div col="4">
        <div class="panel panel-default">
          <div class="panel-body">
            <p class="text-uppercase">Are your Docs up to date ?</p>
          </div>
        </div>
      </div>
    </div>
    <div class="row clearfix">
      <app-spinner [broadSpinner]="true" *ngIf="!isAllDataLoaded"></app-spinner>
    </div>
    <!-- Graphs Rows -->
    <div class="row clearfix">
      <div col="4">
        <app-diligence-by-status
          *ngIf="isAllDataLoaded"
          [dateRange]="dateRangeRatingScheme"
          heading="DD Count by Status"
        ></app-diligence-by-status>
      </div>
      <!-- Docs Columns  -->
      <div col="4">
        <app-recent-diligences
          *ngIf="isAllDataLoaded"
          [dateRange]="dateRangeRatingScheme"
          heading="Diligences by Entities"
        ></app-recent-diligences>
      </div>

      <div col="4">
        <app-recent-documents
          *ngIf="isAllDataLoaded"
          [dateRange]="dateRangeRatingScheme"
          heading="Doc Tracker"
        >
        </app-recent-documents>
      </div>
    </div>

    <div class="clearfix">
      <app-team-activity
        *ngIf="isAllDataLoaded"
        [punchcard]="punchcard_data"
        [punchcard-options]="punchcard_options"
        rowHeaderLabel="name"
        colHeaderLabel="audit_date"
        cellValueLabel="count"
        heading="Team Activity"
        [dateRange]="dateRangeRatingScheme"
      ></app-team-activity>
    </div>

    <div class="row clearfix">
      <div col="6">
        <app-important-full-calendar
          *ngIf="isAllDataLoaded"
          [isManger]="true"
          [dateRange]="dateRangeRatingScheme"
        ></app-important-full-calendar>
      </div>
      <div col="6">
        <app-my-actions
          *ngIf="isAllDataLoaded"
          [dateRange]="dateRangeRatingScheme"
          heading="MY ACTIONS"
        >
        </app-my-actions>
      </div>
    </div>
    <div class="row clearfix">
      <div col="12">
        <app-workflow-process
          *ngIf="isAllDataLoaded"
          [dateRange]="dateRangeRatingScheme"
          heading="Workflow Process"
        >
        </app-workflow-process>
      </div>
    </div>
    <div class="row clearfix">
      <div col="12">
        <dv-recommendations
          *ngIf="entity_id && isAllDataLoaded"
          [dateRangeFilter]="dateRangeRatingScheme"
          [isDashboard]="true"
          [showHeaderUpperCase]="true"
        ></dv-recommendations>
      </div>
    </div>
  </div>
</div>
