<div data-ng-if="vm.Utils.isAngular()">
  <ng2-products-associated-vehicles></ng2-products-associated-vehicles>
</div>
<div data-ng-if="vm.Utils.isAngularJS()" class="row clearfix">
  <div class="col-md-12">
    <div class="panel panel-default borderless-top">
      <div class="panel-body clearfix">
        <spinner broad-spinner spinner-height='40' data-ng-if="!vm.fund"></spinner>

        <div class="dv-table dv-table-middle dd-info-panel"
             data-ng-show="vm.fund">
          <div class="cell">
            <h4 class="clear-margin max-w-320 lh1-5 word-break-break-all">
              {{vm.fund.display_name}} <span class="space-on-left label label-warning" uib-tooltip="Deactivated by the owner firm" ng-show="!vm.fund.platform_active">{{vm.statusLabel.INACTIVE}}</span>
            </h4>
            <p class="text-muted space-on-top" data-ng-if="vm.fund.parentFirm.name">
              <small>Parent Firm:</small>
              <small>
                <a ui-sref="app.firms.profile.monitor({firmId: vm.fund.parentFirm.id})"><strong>{{vm.fund.parentFirm.name}}</strong></a>
              </small>
            </p>
          </div>
          <div class="cell bordered-left">
            <button btn-type="transparent"
                    data-ng-click="vm.addNewVehicleModal()">
              <div><icon name="vehicle-car" class="font-size-18"></icon></div>
              <small>Add Vehicle</small>
            </button>
          </div>
          <div class="cell bordered-left">
            <a class="btn btn-transparent"
               ui-sref="app.monitor.investments">
              <div><icon name="arrow-back" size="2x"></icon></div>
              <small>Back to all {{vm.entity_type | standardPluralize}}</small>
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="row clearfix">
      <div col="12">
        <div class="panel panel-default" data-ng-show="vm.vehicles && vm.vehicles.length">
          <div class="panel-heading">
            <h5 class="panel-title">{{vm.vehicles.length}} Related Vehicle(s)</h5>
          </div>

          <div class="panel-body">
            <ul class="list-unstyled"
                tiles-adjuster="vm.adjust_entity_list"
                use-max-tile-width="true"
                tile-selector="> li">
              <li class="inline-block pull-left"
                  on-render="vm.adjust_entity_list = true"
                  data-ng-repeat="entity in vm.vehicles">
                <div class="panel panel-default relative">
                  <div class="panel-body">
                    <div>
                      <a data-ng-if="!vm.isFreeSubscription" ui-sref="app.firms.funds.vehicles.profile.monitor({firmId:entity.firm_id, fundId: entity.fund_id,vehicleId: entity.id})">
                        {{entity.name}}
                      </a>
                      <a data-ng-if="vm.isFreeSubscription" ui-sref="app.firms.funds.vehicles.profile.aum_tr({firmId:entity.firm_id, fundId: entity.fund_id,vehicleId: entity.id})">
                        {{entity.name}}
                      </a>
                      <span class="space-on-left label label-warning" uib-tooltip="Deactivated by the owner firm" ng-show="!entity.platform_active">{{vm.statusLabel.INACTIVE}}</span>
                    </div>

                    <ul class="list-unstyled space-on-top-lg clear-margin-bottom list-with-icons">
                      <li class="space-on-bottom">
                        <span class="align-middle text-muted"><small>Currency: {{entity.currency}}</small></span>
                      </li>
                      <li>
                        <fund-return fund-return="fund.return"
                          uib-tooltip="Vehicle returns"
                          date="fund.returnAsOfDate"></fund-return>
                      </li>
                    </ul>
                  </div>
                </div>
              </li>
            </ul>
          </div>
        </div>

        <div class="panel panel-default" data-ng-hide="vm.vehicles">
          <div class="panel-body">
            <spinner broad-spinner spinner-height='100'></spinner>
          </div>
        </div>
      </div>
    </div>

    <div class="row clearfix" data-ng-show="vm.vehicles && !vm.vehicles.length">
      <div col="12">
        <empty-state message="No related vehicles found"></empty-state>
      </div>
    </div>

  </div>
</div>
