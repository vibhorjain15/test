<div data-ng-if="vm.Utils.isAngular()">
  <ng2-report-list></ng2-report-list>
</div>
<div data-ng-if="vm.Utils.isAngularJS()">
  <div class="panel panel-default relative">
      <div class="panel-heading">
          <h5 class="panel-title">Presentation Reports</h5>

          <div class="panel-controls">
              <div class="panel-controls-wrapper">
                <a class="panel-control"
                  ui-sref="app.reports.new_report"
                  uib-tooltip="Create New Report">
                  <icon name="plus"></icon>
                </a>
              </div>
          </div>
      </div>
      <div class="panel-body">
        <div data-ng-if="vm.reports">
          <dv-grid grid-resource="vm.reports" name="vm.reportsGrid" grid-name="'realtime-reports-list'"></dv-grid>
        </div>
      </div>
  </div>
</div>
