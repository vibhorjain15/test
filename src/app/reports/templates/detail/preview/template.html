<div class="panel panel-default">
  <div class="panel-body clearfix">
    <spinner data-ng-hide="vm.template"></spinner>

    <div class="dv-table dv-table-middle dd-info-panel"
         data-ng-show="vm.template">
      <div class="bordered-right text-center cell" col="3">
        <h4 class="clear-margin">
          Previewing <b>{{vm.template.name}}</b>
        </h4>

        <div class="space-on-top-lg">
          <small class="text-muted">
            Last Updated {{vm.template.updated_at|fromNow}}
          </small>
        </div>
      </div>
      <div class="cell border-right text-center" col="3">
        <div class="btn-group">
            <label class="btn btn-default font-size-12" data-ng-class="{'btn-primary': vm.entity_type == 'Fund'}" data-ng-click="vm.setEntityType('Fund')"><icon name="fund" class="space-on-right"></icon> Product</label>
            <label class="btn btn-default font-size-12" data-ng-class="{'btn-primary': vm.entity_type == 'Firm'}" data-ng-click="vm.setEntityType('Firm')"><icon name="institution" class="space-on-right"></icon> Firm</label>
        </div>
      </div>

      <div class="cell bordered-right" col="3" data-ng-show="vm.entity_type == 'Fund'">
        <label for="template-selection" class="control-label">
          Select a Product
        </label>

        <select id="template-selection"
                class="form-control"
                chosen
                data-ng-model="vm.selected_entity"
                data-ng-change="vm.composeOptions(vm.selected_entity)"
                no-results-text="'Could not find any funds'"
                data-placeholder="Filter by Fund"
                data-ng-options="fund as fund.name for fund in vm.funds">
          <option value=""></option>
        </select>
      </div>
      <div class="cell bordered-right" col="3" data-ng-show="vm.entity_type == 'Firm'">
        <label for="template-selection" class="control-label">
          Select a Firm
        </label>

        <select id="template-selection"
                class="form-control"
                chosen
                data-ng-model="vm.selected_entity"
                data-ng-change="vm.composeOptions(vm.selected_entity)"
                no-results-text="'Could not find any funds'"
                data-placeholder="Filter by Fund"
                data-ng-options="firm as firm.name for firm in vm.firms">
          <option value=""></option>
        </select>
      </div>

      <div class="cell bordered-right" col="1">
        <a class="btn btn-transparent"
           ui-sref="app.reports.templates.detail.edit">
          <div><icon name="pencil" size="2x"></icon></div>
          <small>Edit</small>
        </a>
      </div>
      <div class="cell text-center" col="3">
        <a class="btn btn-transparent clickable"
           data-ng-click="vm.resetSelection()">
          <div><icon name="refresh" size="2x"></icon></div>
          <small>Reset</small>
        </a>
      </div>

    </div>
  </div>
</div>

<div class="row clearfix">
  <div col="8" offset="2">
    <div class="panel panel-default"
         data-ng-show="vm.template && vm.options">
      <report-preview template="vm.template" type="'preview-template'" options="vm.options">
      </report-preview>
    </div>
  </div>
</div>
