<div class="panel panel-default">
  <div class="panel-heading">
        <span>
          <icon name="calendar" class="space-on-right align-middle"></icon>
          <span class="align-middle">
            Meetings
            <span data-ng-show="vm.meetings.length">
              ({{vm.meetings.length}})
            </span>
          </span>
        </span>

      <div class="panel-controls">
          <div class="panel-controls-wrapper">
              <a class="panel-control"
                 data-ng-click="vm.addMeeting()"
                 uib-tooltip="Add New Meeting">
                  <icon name="plus"></icon>
              </a>
          </div>
      </div>
  </div>

  <div class="panel-body" data-ng-if="!vm.meetings">
    <spinner broad-spinner spinner-height='60'></spinner>
  </div>

  <div class="panel-body"
       data-ng-if="vm.meetings && vm.meetings.length == 0">
    <empty-state
            message="There are no meetings!"></empty-state>
  </div>

  <div class="panel-body has-notes-form clear-padding" data-ng-if="vm.meetings && vm.meetings.length > 0">
    <ul class="list-group clear-margin-bottom tasks-list">
      <li class="list-group-item pa-tb-xl pa-lr-xxl task-item"
          data-ng-repeat="meeting in vm.meetings">
        <div class="media">
          <div class="media-body">
            <div class="dv-table full-width">
              <div class="cell align-middle">

                <span data-ng-if="meeting.event_start_at">
                  <!-- Currently this directive is used in 2 places, funds monitor and firms monitor pages. ^ means parent state
                  of this state. If the current state is "app.firms.profile.monitor". ^.^. will refer to app.firms. same for funds.
                  If we use this directive in any other place, we will have to add custom logic here to redirect to the appropriate
                  meetings detail page.
                  -->
                  <small class="text-muted"><a ui-sref="^.^.meetings.detail({Id: meeting.id})">{{meeting.name}}</a>
                  on {{vm.getMeetingsDate(meeting.event_start_at) | date}}</small>
                </span>

                <span class="pull-right">
                  <small class="text-muted v-align-text-top space-on-right" uib-tooltip="Edit this meeting">
                    <a class="link-disguise clickable"
                       data-ng-click="vm.editMeeting(meeting, $index)">edit</a>
                  </small>
                </span>
              </div>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
