<div class="panel panel-default">
  <div class="panel-heading">
        <span>
          <icon name="cogs" class="space-on-right align-middle"></icon>
          <span class="align-middle">
            Workflow Process
            <span data-ng-show="vm.workflows.length">
              ({{vm.workflows.length}})
            </span>
          </span>
        </span>

      <div class="panel-controls" data-ng-if="!vm.insertDisabled">
          <div class="panel-controls-wrapper">
              <a class="panel-control"
                 data-ng-click="vm.addWorkflow()"
                 uib-tooltip="Start Workflow Process">
                  <icon name="plus"></icon>
              </a>
          </div>
      </div>
  </div>

  <div class="panel-body" data-ng-if="!vm.workflows">
    <spinner broad-spinner spinner-height='60'></spinner>
  </div>

  <div class="panel-body"
       data-ng-if="vm.workflows && vm.workflows.length == 0">
    <empty-state
            message="There are no workflows"></empty-state>
  </div>

  <div class="panel-body has-notes-form clear-padding" data-ng-if="vm.workflows && vm.workflows.length > 0">
    <table class="table workflows_table">
      <tbody>
        <tr data-ng-repeat="workflow in vm.workflows">
          <td>
            <a ui-sref="app.workflow_automation.detail({Id: workflow.id})">
              {{workflow.name}}
            </a>
          </td>
          <td>
            <small class="text-muted">
              as of {{(workflow.updated_at?workflow.updated_at:workflow.created_at) | fromNow}}
            </small>
          </td>
          <td>
            <uib-progressbar value="workflow.pct_complete"
                             type="success"
                             class="bs-progress">
              <span data-ng-class="{'text-black': workflow.pct_complete == 0}"
                    class="text-nowrap">
                {{workflow.pct_complete}}%
              </span>
            </uib-progressbar>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
