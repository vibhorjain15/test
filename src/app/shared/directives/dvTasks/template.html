<div class="panel panel-default">
  <div class="panel-heading">
        <span>
          <icon name="tasks" class="space-on-right align-middle"></icon>
          <span class="align-middle">
            Open Tasks / Reminders
            <span data-ng-show="vm.tasks.length">
              ({{vm.tasks.length}})
            </span>
          </span>
        </span>

      <div class="panel-controls">
          <div class="panel-controls-wrapper">
              <a class="panel-control"
                 data-ng-click="vm.addTask()"
                 uib-tooltip="Add New Task">
                  <icon name="plus"></icon>
              </a>
          </div>
      </div>
  </div>

  <div class="panel-body" data-ng-if="!vm.tasks">
    <spinner broad-spinner spinner-height='60'></spinner>
  </div>

  <div class="panel-body"
       data-ng-if="vm.tasks && vm.tasks.length == 0">
    <empty-state
            message="There are no open tasks present!"></empty-state>
  </div>

  <div class="panel-body has-notes-form clear-padding" data-ng-if="vm.tasks && vm.tasks.length > 0">
    <ul class="list-group clear-margin-bottom tasks-list">
      <li class="list-group-item pa-tb-xl pa-lr-xxl task-item"
          data-ng-repeat="task in vm.tasks">
        <div class="media">
          <div class="media-left padded-top">
                <span class="circled-initials clear-margin-left">
                  {{$index+1}}
                </span>
          </div>

          <div class="media-body">
            <div class="dv-table full-width">
              <div class="cell align-middle">
                      <span data-ng-if="task.due_date">
                        <small class="text-muted">Due {{task.due_date|date}}</small>
                      </span>
                <span class="space-on-right-lg label text-uppercase label-default" data-ng-if="task.assigned_to_member" uib-tooltip="Assigned to">
                        <small>{{task.assigned_to_member}}</small>
                      </span>

                <button btn-type="default"
                        uib-tooltip="Mark as complete"
                        data-ng-click="vm.markTaskAsComplete(task)"
                        class="primary pull-right space-on-right space-on-top"
                        size="xs"
                        data-ng-if="!task.is_complete">
                  <icon name="check"></icon>
                </button>

                <icon name="check" class="text-primary pull-right space-on-right-lg space-on-top-lg"
                      uib-tooltip="Completed"
                      data-ng-if="task.is_complete"></icon>

                <p data-ng-if="!task.is_complete" class="space-on-bottom space-on-top"><span class="word-break-break-all" ng-bind-html="task.text"></span></p>
                <p data-ng-if="task.is_complete" class="space-on-bottom space-on-top text-striken"><span class="word-break-break-all" ng-bind-html="task.text"></span></p>

                <span class="pull-left" data-ng-if="!task.is_complete">
                            <small class="text-muted v-align-text-top space-on-right" uib-tooltip="Edit this task">
                              <a class="link-disguise clickable"
                                 data-ng-click="vm.editTask(task, $index)">edit</a>
                            </small>
                            <small class="text-muted v-align-text-top" uib-tooltip="Delete this task">
                              <a class="link-disguise clickable"
                                 data-ng-click="vm.confirmDeleteTask(task)">delete</a>
                            </small>
                      </span>
              </div>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
