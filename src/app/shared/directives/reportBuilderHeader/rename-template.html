<form name="vm.template_rename_form"
      data-ng-submit="vm.updateTemplate()">
  <div class="form-group">
    <input type="text"
           focus-me="vm.template_params"
           class="form-control"
           dv-restrict-input="{type: 'avoidFirstSplCharacter'}"
           data-ng-model="vm.template_params.name" />
  </div>

  <div class="form-group">
    <button type="submit" button-loader="vm.saving_template">
      Save
    </button>

    <button btn-type="default"
            data-ng-click="vm.isPopoverOpen = false">Cancel</button>
  </div>
</form>
