<div class="dv-sidebar-panel js-sidebar-panel"
     data-ng-class="{'in': vm.display_sidebar}"
     data-ng-show="vm.display_sidebar">
  <div class="panel panel-primary">
    <div class="panel-heading text-center">
      <h5 class="panel-title">
        <b class="js-sidebar-title"></b>
        <a class="pull-right clickable link-disguise"
           data-ng-click="vm.close()">
          <icon name="close" size="lg"></icon>
        </a>
      </h5>
    </div>

    <div class="panel-body js-sidebar-content-container">
    </div>
  </div>
</div>
