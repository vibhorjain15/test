<ui-grid-cell-contents>
    <div>
        <div data-ng-show="row.entity[col.field].length > 0">
            <span class="label label-default space-on-right" uib-tooltip="{{row.entity[col.field][0]}}"
                ng-click="$event.stopPropagation();">
                <span truncate-text="25">
                    {{row.entity[col.field][0]}}
                </span>
            </span>
            <span data-ng-show="row.entity[col.field].length > 1">and </span>
            <span class="link-underline clickable space-on-right" data-ng-show="row.entity[col.field].length > 1"
                uib-tooltip="{{row.entity[col.field].slice(1).toString()}}">{{row.entity[col.field].length - 1}} more</span>
        </div>
    </div>
</ui-grid-cell-contents>
