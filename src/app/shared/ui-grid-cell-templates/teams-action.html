<ui-grid-cell-contents data-ng-if="!row.groupHeader">
  <button btn-type="default"
          size="sm"
          class="space-on-right"
          data-ng-click="grid.appScope.vm.editTeam(row.entity)"
          uib-tooltip="Edit">
    <icon name="pencil"></icon>
  </button>
  <button btn-type="default"
          size="sm"
          class="space-on-right"
          uib-tooltip="Remove"
          ng-click="grid.appScope.vm.removeUserFromTeamModal(row.entity)">
    <icon name="close"></icon>
  </button>

</ui-grid-cell-contents>
