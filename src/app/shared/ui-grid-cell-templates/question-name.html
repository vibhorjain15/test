<ui-grid-cell-contents class="text-left unstyledLink">
  <div ng-if="row.groupHeader && col.grouping.groupPriority === row.treeLevel"
    class="ui-grid-cell-contents" title="TOOLTIP" uib-tooltip="{{COL_FIELD CUSTOM_FILTERS}}">
    {{COL_FIELD CUSTOM_FILTERS}}
  </div>
  <a ng-if="!row.groupHeader && (!col.grouping || col.grouping.groupPriority === undefined || col.grouping.groupPriority === null)"
     uib-tooltip="{{row.entity.question_text}}"
     target="{{grid.appScope.vm.showingSearchResults ? '_blank' : '_self'}}"
     tooltip-placement="right">
    {{row.entity.question_text}}
  </a>
</ui-grid-cell-contents>
