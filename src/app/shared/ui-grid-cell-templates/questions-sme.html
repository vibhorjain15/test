<ui-grid-cell-contents>
    <div ng-if="row.groupHeader && col.grouping.groupPriority === row.treeLevel"
        class="ui-grid-cell-contents" title="TOOLTIP" uib-tooltip="{{grid.appScope.vm.displayGroupedHeaderName(grid, row, col)}}">
        {{grid.appScope.vm.displayGroupedHeaderName(grid, row, col)}}
    </div>
    <div ng-if="!row.groupHeader && (!col.grouping || col.grouping.groupPriority === undefined || col.grouping.groupPriority === null)">
        <div data-ng-if="row.entity.subject_matter_experts && row.entity.subject_matter_experts.length > 0">
            <span class="space-on-right">{{row.entity.subject_matter_experts[0]}}</span>
            <span data-ng-show="row.entity.subject_matter_experts.length > 1"> and {{row.entity.subject_matter_experts.length - 1}} </span>
            <span class="link-underline space-on-right"
                data-ng-show="row.entity.subject_matter_experts.length > 1"
                uib-tooltip="{{grid.appScope.vm.formatSMETooltip(row.entity.subject_matter_experts)}}">
            more
            </span>
        </div>
        <div data-ng-if="!row.entity.subject_matter_experts">None</div>
    </div>
</ui-grid-cell-contents>
