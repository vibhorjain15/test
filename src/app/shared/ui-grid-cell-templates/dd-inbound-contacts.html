<ui-grid-cell-contents>
  <div data-ng-show="row.entity.contacts.length">
    <span class="label label-default space-on-right text-uppercase">{{row.entity.contacts[0].name}}</span>
    <span class="label label-default space-on-right text-uppercase" data-ng-show="row.entity.contacts.length > 1">{{row.entity.contacts[1].name}}</span>
    <span data-ng-show="row.entity.contacts.length > 2"> and {{row.entity.contacts.length - 2}} </span>
    <span class="link-underline clickable space-on-right"
          data-ng-show="row.entity.contacts.length > 2"
          uib-tooltip="{{grid.appScope.vm.formatTagsTooltip(row.entity.contact_list)}}">
      more
    </span>
  </div>
</ui-grid-cell-contents>
