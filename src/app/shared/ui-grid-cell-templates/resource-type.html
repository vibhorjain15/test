<ui-grid-cell-contents>
  <div ng-if="row.groupHeader && col.grouping.groupPriority === row.treeLevel"
    class="ui-grid-cell-contents" title="TOOLTIP" uib-tooltip="{{grid.appScope.vm.getEntityGroupHeaderName(grid, row, col)}}">
    {{grid.appScope.vm.getEntityGroupHeaderName(grid, row, col)}}
  </div>
  <div ng-if="!row.groupHeader && (!col.grouping || col.grouping.groupPriority === undefined || col.grouping.groupPriority === null)"
     uib-tooltip="{{grid.appScope.vm.getEntityTypeName(row.entity.entity_type)}}"
     tooltip-placement="right">
    {{grid.appScope.vm.getEntityTypeName(row.entity.entity_type)}}
  </div>
</ui-grid-cell-contents>
