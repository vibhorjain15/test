<ui-grid-cell-contents>
  <div class="controls-wrapper">
      <a uib-tooltip="Edit user role"
         data-ng-show="row.entity.user_assigments.length > 0"
         data-ng-click="grid.appScope.vm.displayEditFunctionConfirmation(row.entity)"
         class="btn btn-xs btn-default success">
          <icon name="pencil"></icon>
      </a>
      <a uib-tooltip="Remove user role"
         data-ng-show="row.entity.user_assigments.length > 0"
         data-ng-click="grid.appScope.vm.displayUserRemovalConfirmation(row.entity)"
         class="btn btn-xs btn-default danger space-on-left">
          <icon name="trashcan"></icon>
      </a>
  </div>
</ui-grid-cell-contents>
