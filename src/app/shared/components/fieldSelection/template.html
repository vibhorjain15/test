<div class="row space-on-top-lg">
  <div class="list-group-item" data-ng-if="vm.loading_data">
    <div class="row clearfix">
      <div>
        <spinner broad-spinner spinner-height='20'></spinner>
      </div>
    </div>
  </div>

  <div class="col-md-12" uib-tooltip="{{vm.disabled?'Please contact customer service in order to enable this feature for your firm':''}}">
    <div data-ng-if="!vm.loading_data && vm.fields.length == 0">
      <p class="clear-margin text-center">No fields present, <a class="clickable" data-ng-click="vm.onClose()"
          ui-sref="{{vm.redirectionUrl}}">click here</a> to add one</p>
    </div>
    <div data-ng-if="vm.fields.length > 0">
      <form name="vm.fieldselectionForm">
        <div data-ng-repeat="fieldRow in vm.mandatoryFields" class="space-on-top">
          <div data-ng-repeat="fieldItem in fieldRow.value" ng-if="fieldRow && fieldRow.type == 'text'">
            <form-group field-name="{{fieldRow.alias}}">
              <label class="control-label  text-uppercase" col="3" data-ng-show="$index == 0">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="9">
                  <input type="text"
                    placeholder="Please enter text here" class="form-control" ng-model="fieldItem.value"
                    data-ng-required="fieldRow.is_mandatory"
                    ng-readonly="vm.readonly">
                </span>
                <span col="1">
                  <button btn-type="transparent"
                    data-ng-click="vm.removeField(fieldRow, $index)" class="delete-control" uib-tooltip="Remove field"
                    data-ng-disabled="vm.disabled || vm.readonly">
                    <icon name="trashcan"></icon>
                  </button>
                </span>
                <span col="2" data-ng-if="$index == fieldRow.value.length - 1 && fieldRow.has_multiple">
                  <button class="btn btn-default success btn-sm" uib-tooltip="Add more"
                    data-ng-disabled="vm.readonly"
                    data-ng-click="vm.addNewField(fieldRow)">
                    <icon name="plus"></icon>
                  </button>
                </span>
              </div>
            </form-group>
          </div>
          <div data-ng-repeat="fieldItem in fieldRow.value" ng-if="fieldRow && fieldRow.type == 'textmultiline'">
            <form-group field-name="{{fieldRow.alias}}">
              <label class="control-label  text-uppercase" col="3" data-ng-show="$index == 0">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="12" data-ng-if="vm.readonly">
                  <div ng-bind-html="fieldItem.value | trusthtml" class="preview_div previewReadOnly"></div>
                </span>
                <span col="12" data-ng-if="!vm.readonly">
                  <textarea
                    ui-tinymce="vm.tinymceOptions"
                    class="form-control"
                    placeholder="Please enter text here"
                    data-ng-model="fieldItem.value" data-ng-required="fieldRow.is_mandatory"></textarea>
                </span>
              </div>
            </form-group>
          </div>
          <div ng-if="fieldRow && fieldRow.type == 'int'" data-ng-repeat="fieldItem in fieldRow.value">
            <form-group field-name="{{fieldRow.alias}}">
              <label class="control-label  text-uppercase" col="3" data-ng-show="$index == 0">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="9">
                  <input type="text" ui-number-mask="0"
                    ui-negative-number
                    ng-readonly="vm.readonly"
                    placeholder="Please enter integer here" class="form-control" ng-model="fieldItem.value"
                    data-ng-required="fieldRow.is_mandatory">
                </span>
                <span col="1">
                  <button btn-type="transparent"
                    data-ng-click="vm.removeField(fieldRow, $index)" class="delete-control" uib-tooltip="Remove field"
                    data-ng-disabled="vm.disabled || vm.readonly">
                    <icon name="trashcan"></icon>
                  </button>
                </span>
                <span col="2" data-ng-if="$index == fieldRow.value.length - 1 && fieldRow.has_multiple">
                  <button class="btn btn-default success btn-sm" uib-tooltip="Add more"
                    data-ng-disabled="vm.readonly"
                    data-ng-click="vm.addNewField(fieldRow)">
                    <icon name="plus"></icon>
                  </button>
                </span>
              </div>
            </form-group>
          </div>
          <form-group field-name="{{fieldRow.alias}}" ng-if="fieldRow && fieldRow.type == 'dropdown'">
            <label class="control-label  text-uppercase" col="3">
              {{fieldRow.alias}}
              <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                uib-tooltip="{{fieldRow.description}}">
              </icon>
              <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
            </label>
            <div col="9" class="row pull-right space-on-bottom override-open-downwards ">
              <select class="form-control" chosen
                data-ng-model="fieldRow.value"
                data-ng-disabled="vm.readonly"
                allow-single-deselect="true"
                data-ng-options="option as option.value for option in fieldRow.options"
                data-ng-required="fieldRow.is_mandatory">
                <option value=""></option>
              </select>
              <div data-ng-if="fieldRow.otherOption && fieldRow.value.id == fieldRow.otherOption.id"
                  class="space-on-top">
                <textarea class="form-control"
                          placeholder="Please provide explanation"
                          data-ng-model-options="{ debounce: { 'default': 500 } }"
                          msd-elastic="\n"
                          data-ng-class="{'checkbox-error':fieldRow.otherOption && fieldRow.value.id == fieldRow.otherOption.id && !fieldRow.textExplanation && vm.fieldselectionForm.$submitted}"
                          uib-tooltip="{{fieldRow.otherOption && fieldRow.value.id == fieldRow.otherOption.id && !fieldRow.textExplanation? 'Explanation required':''}}"
                          tooltip-is-open="vm.fieldselectionForm.$submitted"
                          tooltip-trigger="none" tooltip-placement="right"
                          data-ng-required="fieldRow.otherOption && fieldRow.value.id == fieldRow.otherOption.id"
                          data-ng-model="fieldRow.textExplanation"></textarea>
              </div>
            </div>
          </form-group>
          <form-group field-name="{{fieldRow.alias}}" ng-if="fieldRow && fieldRow.type == 'dynamic' && fieldRow.has_multiple">
            <label class="control-label  text-uppercase" col="3">
              {{fieldRow.alias}}
              <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                uib-tooltip="{{fieldRow.description}}">
              </icon>
              <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
            </label>
            <div col="9" class="row pull-right space-on-bottom override-open-downwards ">
              <select class="form-control" chosen
                data-ng-model="fieldRow.value"
                multiple
                data-ng-options="source as source.value for source in fieldRow.dynamicSource"
                ng-readonly="vm.readonly"
                data-ng-required="fieldRow.is_mandatory">
                <option value=""></option>
              </select>
            </div>
          </form-group>
          <form-group field-name="{{fieldRow.alias}}" ng-if="fieldRow && fieldRow.type == 'dynamic' && !fieldRow.has_multiple">
            <label class="control-label  text-uppercase" col="3">
              {{fieldRow.alias}}
              <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                uib-tooltip="{{fieldRow.description}}">
              </icon>
              <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
            </label>
            <div col="9" class="row pull-right space-on-bottom override-open-downwards ">
              <select class="form-control" chosen
                data-ng-model="fieldRow.value"
                allow-single-deselect="true"
                data-ng-options="source as source.value for source in fieldRow.dynamicSource"
                ng-readonly="vm.readonly"
                data-ng-required="fieldRow.is_mandatory">
                <option value=""></option>
              </select>
            </div>
          </form-group>
          <div ng-if="fieldRow && fieldRow.type == 'checkbox'">
            <form-group field-name="{{fieldRow.alias}}">
              <label class="control-label  text-uppercase" col="3">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="12"
                  data-ng-class="{'checkbox-error':fieldRow.is_mandatory && fieldRow.value[0].id == null && vm.fieldselectionForm.$submitted}"
                  uib-tooltip="{{fieldRow.is_mandatory && fieldRow.value[0].id == null?fieldRow.alias+' is required':''}}"
                  tooltip-is-open="vm.fieldselectionForm.$submitted"
                  tooltip-trigger="none" tooltip-placement="right">
                  <dv-checkbox data-ng-repeat="item in ::fieldRow.options"
                    checklist-model="fieldRow.value"
                    checklist-value="item" label="{{::item.value}}"
                    data-ng-disabled="vm.readonly"
                    data-ng-model-options="{ debounce: { 'default': 500 } }"
                    checklist-change="vm.onResponseChange(fieldRow)"
                    data-ng-required="fieldRow.is_mandatory && fieldRow.value[0].id == null">
                  </dv-checkbox>
                </span>
              </div>
              <div col="9" class="row pull-right space-on-top" data-ng-show="fieldRow.otherOption && fieldRow.is_other_option_selected">
                  <textarea class="form-control"
                          placeholder="Please provide explanation"
                          data-ng-model-options="{ debounce: { 'default': 500 } }"
                          msd-elastic="\n"
                          data-ng-required="fieldRow.otherOption && fieldRow.is_other_option_selected"
                          data-ng-model="fieldRow.textExplanation"></textarea>
              </div>
            </form-group>
          </div>
          <div ng-if="fieldRow && fieldRow.type == 'numeric'" data-ng-repeat="fieldItem in fieldRow.value">
            <form-group field-name="{{fieldRow.alias}}">
              <label class="control-label  text-uppercase" col="3" data-ng-show="$index == 0">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="9">
                  <input col="12" type="text" class="form-control"
                    data-ng-model-options="{ debounce: { 'default': 500 } }" dv-decimal-input
                    allow-negative="true" decimal-upto="4" allow-decimal="true" data-ng-model="fieldItem.value"
                    ng-readonly="vm.readonly"
                    placeholder="Please enter numeric here" data-ng-required="fieldRow.is_mandatory" />
                </span>
                <span col="1">
                  <button btn-type="transparent"
                    data-ng-click="vm.removeField(fieldRow, $index)" class="delete-control" uib-tooltip="Remove field"
                    data-ng-disabled="vm.disabled || vm.readonly">
                    <icon name="trashcan"></icon>
                  </button>
                </span>
                <span col="2" data-ng-if="$index == fieldRow.value.length - 1 && fieldRow.has_multiple">
                  <button class="btn btn-default success btn-sm" uib-tooltip="Add more"
                    data-ng-disabled="vm.readonly"
                    data-ng-click="vm.addNewField(fieldRow)">
                    <icon name="plus"></icon>
                  </button>
                </span>
              </div>
            </form-group>
          </div>
          <div ng-if="fieldRow && fieldRow.type == 'link'" data-ng-repeat="fieldItem in fieldRow.value">
            <form-group field-name="{{fieldRow.alias}}" control-selector=".required-input">
              <label class="control-label  text-uppercase" col="3" data-ng-show="$index == 0">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="5">
                  <input type="text" placeholder="Enter title" class="form-control" ng-model="fieldItem.value"
                  ng-readonly="vm.readonly">
                </span>
                <span col="5">
                  <input type="text" placeholder="Enter URL" class="form-control required-input"
                    ng-model="fieldItem.value_url" data-ng-required="fieldRow.is_mandatory || fieldItem.value"
                    ng-pattern="/^(http:\/\/www\.|https:\/\/www\.|http:\/\/|https:\/\/){1}[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,6}(:[0-9]{1,5})?(\/.*)?(\?.*)?$/i"
                    ng-readonly="vm.readonly"
                    custom-pattern-message="Please enter a valid domain or website">
                </span>
                <button col="1" btn-type="transparent"
                  data-ng-click="vm.removeField(fieldRow, $index)" class="delete-control" uib-tooltip="Remove field"
                  data-ng-disabled="vm.disabled || vm.readonly">
                  <icon name="trashcan"></icon>
                </button>
                <button data-ng-if="$index == fieldRow.value.length - 1 && fieldRow.has_multiple" col="1"
                  class="btn btn-default success btn-sm" uib-tooltip="Add more"
                  data-ng-disabled="vm.readonly"
                  data-ng-click="vm.addNewField(fieldRow)">
                  <icon name="plus"></icon>
                </button>
              </div>
            </form-group>
          </div>
        </div>

        <div data-ng-if="vm.showNonMandatoryFields" data-ng-repeat="fieldRow in vm.nonmandatoryFields"
          class="space-on-top">
          <div data-ng-repeat="fieldItem in fieldRow.value" ng-if="fieldRow && fieldRow.type == 'text'">
            <form-group field-name="{{fieldRow.alias}}">
              <label class="control-label  text-uppercase" col="3" data-ng-show="$index == 0">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="9">
                  <input type="text"
                    ng-readonly="vm.readonly"
                    placeholder="Please enter text here" class="form-control" ng-model="fieldItem.value">
                </span>
                <span col="1">
                  <button btn-type="transparent"
                    data-ng-click="vm.removeField(fieldRow, $index)" class="delete-control" uib-tooltip="Remove field"
                    data-ng-disabled="vm.disabled || vm.readonly">
                    <icon name="trashcan"></icon>
                  </button>
                </span>
                <span col="2" data-ng-if="$index == fieldRow.value.length - 1 && fieldRow.has_multiple">
                  <button class="btn btn-default success btn-sm" uib-tooltip="Add more"
                    data-ng-disabled="vm.readonly"
                    data-ng-click="vm.addNewField(fieldRow)">
                    <icon name="plus"></icon>
                  </button>
                </span>
              </div>
            </form-group>
          </div>
          <div data-ng-repeat="fieldItem in fieldRow.value" ng-if="fieldRow && fieldRow.type == 'textmultiline'">
            <form-group field-name="{{fieldRow.alias}}">
              <label class="control-label  text-uppercase" col="3" data-ng-show="$index == 0">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="12" data-ng-if="vm.readonly">
                  <div ng-bind-html="fieldItem.value | trusthtml" class="preview_div previewReadOnly"></div>
                </span>
                <span col="12" data-ng-if="!vm.readonly">
                  <textarea
                    ui-tinymce="vm.tinymceOptions"
                    class="form-control"
                    placeholder="Please enter text here"
                    ng-readonly="vm.readonly"
                    data-ng-model="fieldItem.value"></textarea>
                </span>
              </div>
            </form-group>
          </div>
          <div ng-if="fieldRow && fieldRow.type == 'int'" data-ng-repeat="fieldItem in fieldRow.value">
            <form-group field-name="{{fieldRow.alias}}">
              <label class="control-label  text-uppercase" col="3" data-ng-show="$index == 0">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="9">
                  <input type="text" ui-number-mask="0"
                    ui-negative-number
                    ng-readonly="vm.readonly"
                    placeholder="Please enter integer here" class="form-control" ng-model="fieldItem.value">
                </span>
                <span col="1">
                  <button btn-type="transparent"
                    data-ng-click="vm.removeField(fieldRow, $index)" class="delete-control" uib-tooltip="Remove field"
                    data-ng-disabled="vm.disabled || vm.readonly">
                    <icon name="trashcan"></icon>
                  </button>
                </span>
                <span col="2" data-ng-if="$index == fieldRow.value.length - 1 && fieldRow.has_multiple">
                  <button class="btn btn-default success btn-sm" uib-tooltip="Add more"
                    data-ng-disabled="vm.readonly"
                    data-ng-click="vm.addNewField(fieldRow)">
                    <icon name="plus"></icon>
                  </button>
                </span>
              </div>
            </form-group>
          </div>
          <form-group field-name="{{fieldRow.alias}}" ng-if="fieldRow && fieldRow.type == 'dropdown'">
            <label class="control-label  text-uppercase" col="3">
              {{fieldRow.alias}}
              <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                uib-tooltip="{{fieldRow.description}}">
              </icon>
              <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
            </label>
            <div col="9" class="row pull-right space-on-bottom override-open-downwards ">
              <select class="form-control" chosen
                data-ng-model="fieldRow.value"
                data-ng-disabled="vm.readonly"
                allow-single-deselect="true"
                data-ng-options="option as option.value for option in fieldRow.options">
                <option value=""></option>
              </select>
              <div data-ng-if="fieldRow.otherOption && fieldRow.value.id == fieldRow.otherOption.id"
                  class="space-on-top">
                <textarea class="form-control"
                        placeholder="Please provide explanation"
                        data-ng-model-options="{ debounce: { 'default': 500 } }"
                        msd-elastic="\n"
                        data-ng-class="{'checkbox-error':fieldRow.otherOption && fieldRow.value.id == fieldRow.otherOption.id && !fieldRow.textExplanation && vm.fieldselectionForm.$submitted}"
                        uib-tooltip="{{fieldRow.otherOption && fieldRow.value.id == fieldRow.otherOption.id && !fieldRow.textExplanation? 'Explanation required':''}}"
                        tooltip-is-open="vm.fieldselectionForm.$submitted"
                        tooltip-trigger="none" tooltip-placement="right"
                        data-ng-required="fieldRow.otherOption && fieldRow.value.id == fieldRow.otherOption.id"
                        data-ng-model="fieldRow.textExplanation"></textarea>
              </div>
            </div>
          </form-group>
          <form-group field-name="{{fieldRow.alias}}" ng-if="fieldRow && fieldRow.type == 'dynamic'">
            <label class="control-label  text-uppercase" col="3">
              {{fieldRow.alias}}
              <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                uib-tooltip="{{fieldRow.description}}">
              </icon>
              <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
            </label>
            <div col="9" class="row pull-right space-on-bottom override-open-downwards " data-ng-if="!fieldRow.has_multiple">
              <select class="form-control" chosen
                data-ng-model="fieldRow.value"
                ng-readonly="vm.readonly"
                allow-single-deselect="true"
                data-ng-options="source as source.value for source in fieldRow.dynamicSource">
                <option value=""></option>
              </select>
            </div>
            <div col="9" class="row pull-right space-on-bottom override-open-downwards " data-ng-if="fieldRow.has_multiple">
              <select class="form-control" chosen
                data-ng-model="fieldRow.value"
                multiple
                ng-readonly="vm.readonly"
                data-ng-options="source as source.value for source in fieldRow.dynamicSource">
                <option value=""></option>
              </select>
            </div>
          </form-group>
          <div ng-if="fieldRow && fieldRow.type == 'checkbox'">
            <form-group field-name="{{fieldRow.alias}}">
              <label class="control-label  text-uppercase" col="3">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="12">
                  <dv-checkbox data-ng-repeat="item in ::fieldRow.options"
                    data-ng-disabled="vm.readonly"
                    checklist-model="fieldRow.value" checklist-value="item" label="{{::item.value}}"
                    checklist-change="vm.onResponseChange(fieldRow)">
                  </dv-checkbox>
                </span>
              </div>
              <div data-ng-show="fieldRow.otherOption && fieldRow.is_other_option_selected"
                  col="9" class="row pull-right space-on-top">
                <textarea class="form-control"
                          placeholder="Please provide explanation"
                          data-ng-model-options="{ debounce: { 'default': 500 } }"
                          msd-elastic="\n"
                          data-ng-required="fieldRow.otherOption && fieldRow.is_other_option_selected"
                          data-ng-model="fieldRow.textExplanation"></textarea>
              </div>
            </form-group>
          </div>
          <div ng-if="fieldRow && fieldRow.type == 'numeric'" data-ng-repeat="fieldItem in fieldRow.value">
            <form-group field-name="{{fieldRow.alias}}">
              <label class="control-label  text-uppercase" col="3" data-ng-show="$index == 0">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="9">
                  <input col="12" type="text" class="form-control"
                    data-ng-model-options="{ debounce: { 'default': 500 } }" dv-decimal-input
                    ng-readonly="vm.readonly"
                    allow-negative="true" decimal-upto="4" allow-decimal="true" data-ng-model="fieldItem.value"
                    placeholder="Please enter numeric here" />
                </span>
                <span col="1">
                  <button btn-type="transparent"
                    data-ng-click="vm.removeField(fieldRow, $index)" class="delete-control" uib-tooltip="Remove field"
                    data-ng-disabled="vm.disabled || vm.readonly">
                    <icon name="trashcan"></icon>
                  </button>
                </span>
                <span col="2" data-ng-if="$index == fieldRow.value.length - 1 && fieldRow.has_multiple">
                  <button class="btn btn-default success btn-sm" uib-tooltip="Add more"
                    data-ng-disabled="vm.readonly"
                    data-ng-click="vm.addNewField(fieldRow)">
                    <icon name="plus"></icon>
                  </button>
                </span>
              </div>
            </form-group>
          </div>
          <div ng-if="fieldRow && fieldRow.type == 'link'" data-ng-repeat="fieldItem in fieldRow.value">
            <form-group field-name="{{fieldRow.alias}}">
              <label class="control-label  text-uppercase" col="3" data-ng-show="$index == 0">
                {{fieldRow.alias}}
                <icon name="info" class="text-info" data-ng-if="fieldRow.description"
                  uib-tooltip="{{fieldRow.description}}">
                </icon>
                <span data-ng-if="fieldRow.is_mandatory" class="font-size-10 text-orange align-top">*</span>
              </label>
              <div col="9" class="pull-right space-on-bottom">
                <span col="5">
                  <input type="text" placeholder="Enter title" class="form-control" ng-model="fieldItem.value"
                    ng-readonly="vm.readonly">
                </span>
                <span col="5">
                  <input type="text" placeholder="Enter URL" class="form-control"
                    ng-model="fieldItem.value_url" data-ng-required="fieldItem.value"
                    ng-readonly="vm.readonly"
                    ng-pattern="/^(http:\/\/www\.|https:\/\/www\.|http:\/\/|https:\/\/){1}[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,6}(:[0-9]{1,5})?(\/.*)?(\?.*)?$/i"
                    custom-pattern-message="Please enter a valid domain or website">
                </span>
                <button col="1" btn-type="transparent"
                  data-ng-click="vm.removeField(fieldRow, $index)" class="delete-control" uib-tooltip="Remove field"
                  data-ng-disabled="vm.disabled || vm.readonly">
                  <icon name="trashcan"></icon>
                </button>
                <button data-ng-if="$index == fieldRow.value.length - 1 && fieldRow.has_multiple" col="1"
                  class="btn btn-default success btn-sm" uib-tooltip="Add more"
                  data-ng-disabled="vm.readonly"
                  data-ng-click="vm.addNewField(fieldRow)">
                  <icon name="plus"></icon>
                </button>
              </div>
            </form-group>
          </div>
        </div>
        <div class="pull-right" data-ng-if="vm.nonmandatoryFields.length > 0">
          <a class="link clickable"
            data-ng-click="vm.showNonMandatoryFields = !vm.showNonMandatoryFields">{{vm.showNonMandatoryFields?'Hide':'Show More'}}</a>
        </div>
      </form>
    </div>
  </div>
</div>
