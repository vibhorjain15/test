<div class="panel panel-default">
    <div class="panel-heading">
          <span>
            <icon name="overview" class="space-on-right align-middle"></icon>
            <span class="align-middle">
              Custom Fields
              <span data-ng-show="vm.fields.length">
                ({{vm.fields.length}})
              </span>
            </span>
          </span>

        <div class="panel-controls">
            <div class="panel-controls-wrapper">
                <a class="panel-control"
                  data-ng-class="{'linkDisabled':!vm.fields}"
                  data-ng-click="vm.onAdd()"
                  uib-tooltip="Add New Custom Field">
                  <icon name="pencil"></icon>
                </a>
            </div>
        </div>
    </div>

    <div class="panel-body" data-ng-if="vm.loading_data">
      <spinner broad-spinner spinner-height='60'></spinner>
    </div>

    <div class="panel-body"
         data-ng-if="!vm.loading_data && vm.fields.length == 0">
      <empty-state
              message="There are no custom fields!"></empty-state>
    </div>

    <div class="panel-body has-notes-form clear-padding" data-ng-if="vm.fields && vm.fields.length > 0">
      <ul class="list-group clear-margin-bottom tasks-list overflow-scroll-y-axis overflow-x-hidden max-h-25-em">
        <li class="list-group-item task-item list-unstyled"
            data-ng-repeat="customField in vm.fields" col="12">
            <span col="6">
              <small class="text-muted text-uppercase word-wrap-with-break-word">{{customField.alias}}: </small>
            </span>
            <span col="6">
              <small data-ng-if="(customField.type == 'text' || customField.type == 'int' || customField.type == 'numeric' || customField.type == 'dropdown' || customField.type == 'checkbox') && !customField.has_href" class="text-uppercase word-wrap-with-break-word" data-ng-repeat="field in customField.value track by $index">
                <p data-ng-if="(customField.type == 'text' || customField.type == 'int' || customField.type == 'numeric') || ((customField.type == 'dropdown' || customField.type == 'checkbox') && field.value != 'other')" class="space-on-bottom" data-ng-class="{'label label-default': customField.type == 'dropdown' || customField.type == 'checkbox'}"><span data-ng-if="customField.has_multiple && customField.value.length > 1">{{$index + 1}}. </span>{{ field.value}}</p>
                <p data-ng-if="(customField.type == 'dropdown' || customField.type == 'checkbox') && field.value == 'other'" class="space-on-bottom" data-ng-class="{'label label-default': customField.type == 'dropdown' || customField.type == 'checkbox'}"><span data-ng-if="customField.has_multiple && customField.value.length > 1">{{$index + 1}}. </span>{{ field.value}},{{field.explanation}}</p>
              </small>
              <small data-ng-if="customField.type == 'textmultiline'" class="space-on-right word-wrap-with-break-word" data-ng-repeat="field in customField.value track by $index" data-ng-bind-html="field.value">
              </small>
              <small data-ng-if="customField.type == 'dynamic'" class="text-uppercase space-on-right word-wrap-with-break-word" data-ng-repeat="field in customField.value track by $index">
                <a class="link-underline" href="{{field.redirect_url}}" target="_blank">{{field.value}}</a>
              </small>
              <small data-ng-if="customField.type == 'link'" class="text-uppercase space-on-right word-wrap-with-break-word" data-ng-repeat="field in customField.value">
                <a class="link-underline" href="{{field.value_url}}" target="_blank">{{field.value? field.value: field.value_url}}</a>
              </small>
              <small data-ng-if="customField.has_href" class="text-uppercase space-on-right word-wrap-with-break-word" data-ng-repeat="field in customField.value">
                <a class="link-underline" href="{{field.dynamic_url}}" target="_blank">{{field.value}}</a>
              </small>
            </span>
        </li>
      </ul>
    </div>
  </div>
