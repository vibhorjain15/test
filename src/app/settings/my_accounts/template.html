<div data-ng-if="vm.Utils.isAngular()"> <ng2-my-accounts></ng2-my-accounts> </div>
 <div data-ng-if="vm.Utils.isAngularJS()">
  <div class="panel panel-default borderless-top">
    <div class="panel-body clearfix">
      <spinner broad-spinner spinner-height='65' data-ng-show="vm.loading"></spinner>

      <div class="dv-table dv-table-middle dd-info-panel">
        <div class="bordered-right cell">
          <div class="lh1-5">
            <strong>{{vm.current_user.fullName}}</strong>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="panel panel-default">
    <div class="panel-heading">
      <h5 class="panel-title">My Accounts</h5>
    </div>
    <div class="panel-body">
      <div class="firmswitchContainer" ng-if="vm.firmSwitching">
        <div class="loaderContainer">
          <h3>Switching to: <strong>{{vm.selectedFirm.firm_name}}</strong></h3>
          <div class="firmSwitchLoader"></div>
        </div>
      </div>
      <div data-ng-if="vm.myAccountsData" class="space-on-top-lg">
        <dv-grid grid-resource="vm.myAccountsData" grid-name="'my-accounts'"></dv-grid>
      </div>
    </div>
  </div>
</div>
