<div data-ng-if="vm.Utils.isAngular()"> <ng2-email-templates></ng2-email-templates> </div>
<div data-ng-if="vm.Utils.isAngularJS()" class="panel panel-default">
  <div class="panel-heading">
    <h5 class="panel-title">Email Templates</h5>

    <div class="panel-controls">
      <div class="panel-controls-wrapper">
        <a class="panel-control"
           data-ng-click="vm.addEmailTemplate()"
           uib-tooltip="Add New Template">
          <icon name="plus"></icon>
        </a>
      </div>
    </div>
  </div>

  <div class="panel-body">
    <div data-ng-if="vm.renderGrid && !vm.loading">
      <dv-grid grid-resource="vm.email_templates" grid-name="'email-templates'"></dv-grid>
    </div>
    <div class="text-center" data-ng-if="vm.loading && !vm.renderGrid">
      <spinner></spinner>
    </div>
  </div>
</div>
