<div data-ng-if="vm.Utils.isAngular()"> <ng2-permissions></ng2-permissions> </div>
<div data-ng-if="vm.Utils.isAngularJS()" class="panel panel-default relative">
    <div class="panel-heading">
        <h5 class="panel-title">Permissions</h5>

        <div class="panel-controls">
            <div class="panel-controls-wrapper">
                <a id="js-add-team-members" class="panel-control"
                   data-ng-click="vm.openNewPermissionDialog()"
                   tooltip-placement="left"
                   uib-tooltip="Add New Permission">
                    <icon name="plus"></icon>
                </a>
            </div>
        </div>
    </div>
    <div class="panel panel-info" data-ng-hide="vm.permissions_enabled">
      <div class="panel-heading permissionsHelpText">You are eligible for permissioning/team module. Please reach out to our customer service at <a href="mailto:ask@diligencevault.com?subject=Team permission">ask@diligencevault.com</a> to enable this.</div>
    </div>
    <div class="panel-body">
      <div class="panel panel-default bg-sky-blue" data-ng-if="vm.show_bulk_actions">
        <div class="panel-body padded-lg">
          <h5 class="inline space-on-right-lg">
            <strong>Selected Records : <span class="badge">{{vm.totalSelectedRecords}}</span></strong>
          </h5>
          <a class="btn btn-default danger space-on-right-lg"
             uib-tooltip="Delete Selected"
             data-ng-hide="vm.bulkResourceEditMode"
             data-ng-class="{'linkDisabled': (vm.totalSelectedRecords > 1000  || vm.freeSubscription)}"
             data-ng-click="vm.confirmBulkResourceDeletion()">
            <strong><icon name="trashcan"></icon>  </strong>
          </a>

          <a class="btn pull-right text-black danger" uib-tooltip="Close" data-ng-click="vm.closeQuickActions('assignments_grid')">
            <strong><icon name="close"></icon></strong>
          </a>
        </div>
      </div>
        <div data-ng-if="vm.render_grid">
            <dv-grid grid-resource="vm.permissions" name="vm.permissions_grid" grid-name="'permissions'"></dv-grid>
        </div>
        <div class="text-center" data-ng-if="!vm.render_grid">
            <spinner></spinner>
        </div>
    </div>
</div>
