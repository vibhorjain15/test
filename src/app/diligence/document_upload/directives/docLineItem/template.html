<div class="panel panel-default">
  <div class="panel-body">
    <form class="form-horizontal">
      <div class="form-group">
        <label class="control-label col-sm-2">
          Question Text:
        </label>

        <div class="col-sm-10">
          <p class="form-control-static">
            {{vm.line_item.extracted_text}}
          </p>
        </div>
      </div>

      <div class="form-group">
        <label class="control-label col-sm-2">
          Mapped to:
        </label>

        <div class="col-sm-8">
          <select class="form-control"
                  chosen
                  data-ng-options="question.id as question.text for question in vm.questions"
                  data-ng-change="vm.saveNewMapping()"
                  data-ng-model="vm.line_item.question_id">
            <option value="">--Select--</option>
          </select>
        </div>

        <div class="col-sm-2">
          <button block
                  btn-type="default"
                  data-ng-show="vm.questions && vm.mapped_question.text != vm.line_item.extracted_text"
                  uib-tooltip="Mark this as a new question"
                  data-ng-click="vm.openAddQuestionsDialog()">
            Add as New
          </button>
        </div>
      </div>

      <div class="form-group"
           data-ng-show="vm.mapped_question_response_type.description">
        <label class="control-label col-sm-2">
          Response Type:
        </label>

        <div class="col-sm-5">
          <p class="form-control-static">
            {{vm.mapped_question_response_type.description}}
          </p>
        </div>
      </div>
    </form>
  </div>
</div>
