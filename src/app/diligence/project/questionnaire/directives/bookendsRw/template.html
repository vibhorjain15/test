<div class="row clearfix">
  <div class="col-xs-6">
    <input type="number"
           class="form-control"
           placeholder="Min"
           ng-pattern="/^(?:\d*\.\d+|\d+)$/"
           ng-model-options="{ debounce: { 'default': 500 } }"
           data-ng-model="response.numericResponseA" />
  </div>

  <div class="col-xs-6">
    <input type="number"
           class="form-control"
           placeholder="Max"
           min="{{response.numericResponseA}}"
           ng-pattern="/^(?:\d*\.\d+|\d+)$/"
           ng-model-options="{ debounce: { 'default': 500 } }"
           data-ng-model="response.numericResponseB" />
  </div>
</div>
