<dv-radio
  type="info inline"
  data-ng-value="true"
  data-ng-change="vm.onResponseChange()"
  data-ng-model="vm.response.attributes.booleanResponse"
  label="Yes">
</dv-radio>

<dv-radio
  type="info inline"
  data-ng-value="false"
  data-ng-change="vm.onResponseChange()"
  class="space-on-left"
  data-ng-model="vm.response.attributes.booleanResponse"
  label="No">
</dv-radio>
