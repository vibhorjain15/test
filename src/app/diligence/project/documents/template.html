<div data-ng-if="vm.Utils.isAngular()">
  <ng2-entity-documents></ng2-entity-documents>
</div>
<div class="row clearfix" data-ng-if="vm.Utils.isAngularJS()">
  <div class="col-md-12">
    <div class="panel panel-default borderless-top">
      <div class="panel-body clearfix">
        <spinner broad-spinner spinner-height='65' data-ng-if="!vm.diligence"></spinner>


        <div class="dv-table dv-table-middle dd-info-panel"
             data-ng-if="vm.diligence">
          <div class="bordered-right cell">
            <h4 class="clear-margin max-w-320 lh1-5 word-break-break-all">
              {{::vm.diligence.entity_name}}
            </h4>
            <small class="text-muted">
              Diligence | <ng-pluralize count="vm.documentCount"
                                        data-ng-show="vm.documentCount"
                                        when="{'1': '1 document', 'other': '{} documents'}"></ng-pluralize>
            </small>
          </div>

          <div class="cell bordered-left" data-ng-if="!vm.isFreeInvestor && ((!(vm.diligence.status == 'Completed') && vm.isManager) || !vm.isManager)">
              <button btn-type="transparent"
                      data-ng-disabled="vm.diligence.isLocked"
                      data-ng-click="vm.openUploadDocumentModal()">
              <div><icon name="file-add" size="2x"></icon></div>
              <small>Add Document</small>
            </button>
          </div>

          <div class="cell" data-ng-if="vm.diligence.status == 'Completed' && vm.isManager">
            <p class="alert alert-info">
              <small>
                This project is now locked. You cannot add/remove any more documents.
              </small>
            </p>
          </div>

          <div class="cell cell-right" data-ng-if="vm.subscription != 'Free'">
            <search-input router-state="^.list"></search-input>
          </div>
        </div>
      </div>
    </div>

    <ui-view />

  </div>
</div>
