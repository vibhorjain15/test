<div id="js-questionnaire-parent-tpl" class="row clearfix relative">
  <div id="js-print-template-new" class="col-md-12">
      <div class="panel panel-default" data-ng-hide="!vm.loading_child_sections">
          <div class="panel-body">
              <spinner broad-spinner spinner-height='40' spinner-text={{vm.spinner_text}}></spinner>
          </div>
      </div>

    <div id="child_section_{{::section.id}}" class="panel panel-default qa-panel"
         data-ng-repeat="section in vm.child_sections"
         data-ng-show="!vm.loading_child_sections">
      <div class="panel-heading">
        <div class="clearfix">
          <div class="pull-left header-component">
            <b>{{::section.name}}</b>
          </div>
        </div>
      </div>

      <div>
        <div class="alert alert-info clear-margin clear-border-radius borderless"
           data-ng-show="section.headerText">
          <div data-ng-bind-html="section.headerText | cleanhtml"></div>
        </div>

        <div data-ng-repeat="sequence in section.sequences track by sequence.cid"
             class="qa-response-sequence"
             data-ng-show="section.questions.length">
          <form>
            <print-preview-form-control data-ng-repeat="response in ::sequence.responses"
                                        response="response">
            </print-preview-form-control>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
