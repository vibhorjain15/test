<ng2-due-diligence-compare data-ng-if="vm.Utils.isAngular()"></ng2-due-diligence-compare> 
<div data-ng-if="vm.Utils.isAngularJS()" class="panel panel-default">
  <div class="panel-body padding-0">
    <div class="dv-table full-width dd-info-panel">
      <div col="3" class="bordered-right cell text-center">
        <h4 class="text-uppercase space-on-top-lg">
          Compare Due diligences
        </h4>
      </div>
      <div col="6" class="cell bordered-right text-center">
        <div class="btn-group space-on-top-lg">
          <!-- When selected dd are == 2 -->
          <label data-ng-if="vm.selectedDueDiligences.length == 2" uib-tooltip="Track Changes" class="btn btn-default font-size-12" data-ng-class="{'btn-primary': vm.activeTab == 'trackChanges' , 'disabled': (vm.selectedDueDiligences.length != 2 && vm.activeTab != 'trackChanges') }" data-ng-click="vm.toggleComparisonTab('trackChanges')">Track Changes</label>
          <!-- When selected dd are != 2 -->
          <label data-ng-if="vm.selectedDueDiligences.length != 2" uib-tooltip="Changes can only be tracked between 2 diligences" class="btn btn-default font-size-12" data-ng-class="{'btn-primary': vm.activeTab == 'trackChanges' , 'disabled': (vm.selectedDueDiligences.length != 2 && vm.activeTab != 'trackChanges') }" data-ng-click="vm.toggleComparisonTab('trackChanges')">Track Changes</label>

          <label class="btn btn-default font-size-12" data-ng-class="{'btn-primary': vm.activeTab == 'showAll'}" data-ng-click="vm.toggleComparisonTab('showAll')">Show All</label>
          <label class="btn btn-default font-size-12" data-ng-class="{'btn-primary': vm.activeTab == 'showFlagged'}" data-ng-click="vm.toggleComparisonTab('showFlagged')">Flagged</label>
          <label class="btn btn-default font-size-12" data-ng-class="{'btn-primary': vm.activeTab == 'showScoreMap'}" data-ng-click="vm.toggleComparisonTab('showScoreMap')">Score Map</label>

        </div>
      </div>

      <div col="2" class="cell text-center">
        <button btn-type="transparent" data-ng-click="vm.returnToDDList()">
          <div><icon name="arrow-back" size="2x"></icon></div>
          <small>Go back</small>
        </button>
      </div>
    </div>
  </div>
</div>
<div class="compare_screen_second">
<div id="{{vm.headersRow}}" scroll-group data-ng-if="vm.compareResults.length" class="panel panel-default panel-compare overflow-x-scroll" >

  <div class="panel-body padding-0">
    <div class="dv-table dv-table-middle compare-dd-results">
      <div class="cell text-center pos-rel padding-0" ng-repeat="fundName in vm.fundNames track by $index" data-ng-class="{'col-md-4': vm.fundNames.length == 3, 'col-md-6': vm.fundNames.length == 2, 'vs bordered-right': !$last}">
        <icon data-ng-if="vm.fundNames.length > 2" name="close closeIcon" size="lg" data-ng-click="vm.removeSelectedItem(fundName.id,fundName.idx)"></icon>
        <h5 truncate-text="25" uib-tooltip="{{fundName.name}}">{{fundName.name}}</h5>
        <h6><b>{{fundName.created_at | date:'longDate'}}</b></h6>
        <br>
        <small class="scoreAndFlagInTrackChanges">
          <b data-ng-if="fundName.total_flags && vm.activeTab != 'showScoreMap'">
            {{fundName.total_flags}}
            <icon class="align-middle space-on-left" name="flag"
                  uib-tooltip="{{fundName.total_flags ? fundName.total_flags + ' flag(s) have been set': 'No flag set'}}"
                  data-ng-class="{'dd-no-flag-set': !fundName.total_flags, 'text-danger': fundName.total_flags}"></icon>
            </b>
            <b data-ng-if="fundName.aggregate_score && fundName.aggregate_total && vm.secondary_rating_scales && vm.secondaryNaValue">
              <dd-rated-score score="fundName.aggregate_score"
                              keep-watcher-on="true"
                              rating-scale="vm.secondary_rating_scales"
                              na-value="vm.secondaryNaValue"
                              total="fundName.aggregate_total"
                              show-total="vm.ratingScheme.primary_rating_scale_mode == 'ScoreBand'"
                              rating-value="fundName.aggregate_rating"
                              use-rating-value="true"
                              ></dd-rated-score>
          </b>
        </small>
      </div>
    </div>
  </div>
</div>
<div class="panel panel-default">
  <div class="text-center space-on-top-lg"  data-ng-show="vm.isLoading">
    <spinner></spinner>
  </div>

  <div class="panel-body dd-compare-view scroll_container" data-ng-if="!vm.isLoading && vm.compareResults.length" id="{{vm.headersRowBody}}" data-ng-init="vm.getHeight('scroll_container')">
    <table class="table clear-margin-bottom">
      <tbody>
      <tr>
        <td class="borderless align-middle">
        <div>

          <div>
            <div class="text-center text-muted panel-heading" data-ng-if="vm.compareResults[0].response.length == 2 && vm.activeTab == 'trackChanges'" data-ng-show="vm.compareResults[0].response[1].fundName != vm.compareResults[0].response[0].fundName">
              <small>You are comparing two different products</small>
            </div>
            <table class="table no-margin-fixed-table" data-ng-if="vm.activeTab == 'trackChanges' && vm.compareResults.length">
              <tbody>
                <tr>
                  <td><h5><b>{{vm.compareResults[0].response[0].fundName}} </b></h5></td>
                  <td><h5><b>{{vm.compareResults[0].response[1].fundName}} </b></h5></td>
                  <td><h5><b>Changes</b></h5></td>
                </tr>
              </tbody>
            </table>

            <!-- data-ng-class="{'space-on-right-xl': vm.fundNames.length > 3}" -->
            <div data-ng-if="vm.activeTab == 'showAll' || vm.activeTab == 'showFlagged'"
                 infinite-scroll="vm.getResponses()" infinite-scroll-parent infinite-scroll-container="'.scroll_container'" infinite-scroll-distance="1">
                <div class="panel panel-default panel-compare" data-ng-repeat="result in vm.compareResponsesPaged">
                <div class="panel-heading">
                  <span ng-bind-html="result.questionText | trusthtml"></span>
                </div>
                <div class="panel-body">
                  <div class="dv-table dv-table-middle compare-dd-results">
                    <div class="cell compare-dd-results-responses text-center pos-rel no-padding-imp"
                        data-ng-repeat="response in result.response"
                        data-ng-class="{'col-md-4': vm.fundNames.length == 3, 'col-md-6': vm.fundNames.length == 2, 'bordered-right': !$last}">
                      <div class="text-align-justify text-center max-w-100-p overflow-auto padded-xl" ng-bind-html="response.responseText | trusthtml">
                      </div>
                      <small class="text-muted block-display" data-ng-hide="response.responseText != null">
                        <i>No response</i>
                      </small>
                      <br>
                      <small class="scoreAndFlagInTrackChanges">
                        <b data-ng-if="response.is_flagged">
                        <icon class="align-middle space-on-left" name="flag"
                              data-ng-class="{'dd-no-flag-set': !response.is_flagged, 'text-danger': response.is_flagged}"></icon>
                        </b>
                        <b data-ng-if="response.score && response.aggregate_score && vm.rating_scales && vm.naValue">
                          <dd-rated-score score="response.score"
                                keep-watcher-on="true"
                                rating-scale="vm.rating_scales"
                                na-value="vm.naValue"
                                total="response.aggregate_score"
                                rating-value="response.rating"
                                use-rating-value="true"
                                ></dd-rated-score>
                        </b>
                      </small>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- If trackChanges -->
            <div data-ng-if="vm.activeTab == 'trackChanges'"
                 infinite-scroll="vm.getResponses()" infinite-scroll-parent infinite-scroll-container="'.scroll_container'" infinite-scroll-distance="1">
              <div class="panel panel-default panel-compare" data-ng-repeat="result in vm.compareResponsesPaged">
                <div class="panel-heading">
                  <span ng-bind-html="result.questionText | trusthtml"></span>
                </div>
                <div class="panel-body">
                  <div class="dv-table dv-table-middle compare-dd-results">
                    <div class="cell compare-dd-results-responses text-center pos-rel no-padding-imp"
                        data-ng-repeat="response in result.response"
                        data-ng-class="{'col-md-4': vm.fundNames.length == 3, 'col-md-6': vm.fundNames.length == 2, 'bordered-right': !$last}">
                      <div class="text-align-justify text-center max-w-100-p overflow-auto padded-xl" ng-bind-html="response.responseText | trusthtml">
                      </div>
                      <small class="text-muted block-display padded-bottom" data-ng-hide="response.responseText != null">
                        <i>No response</i>
                      </small>
                    </div>
                    <div class="cell text-center overflow-x-scroll">
                      <span jsdiff-compare current="result.response[1].responseText | trusthtml" previous="result.response[0].responseText" consider-null
                            data-ng-if="((result.response[0].response_type == 'Date' || result.response[0].response_type == 'TextEmail' || result.response[0].response_type == 'CheckBox' || result.response[0].response_type == 'Dropdown' || result.response[0].response_type == 'Bookends' || result.response[0].response_type == 'Text' || result.response[0].response_type == 'NoPlus' || result.response[0].response_type == 'Boolean' || result.response[0].response_type == 'Percentage' || result.response[0].response_type == 'TextPhone' || result.response[0].response_type == 'BooleanPlus') && (result.response[1].response_type == 'Date' || result.response[1].response_type == 'TextEmail' || result.response[1].response_type == 'CheckBox' || result.response[1].response_type == 'Dropdown' || result.response[1].response_type == 'Bookends' || result.response[1].response_type == 'Text' || result.response[1].response_type == 'NoPlus' || result.response[1].response_type == 'Boolean' || result.response[1].response_type == 'Percentage' || result.response[1].response_type == 'TextPhone' || result.response[1].response_type == 'BooleanPlus'))"></span>

                      <span numericdiff consider-null current="result.response[1].numericResponseA" previous="result.response[0].numericResponseA"
                            data-ng-if="((result.response[0].response_type == 'Integer' || result.response[0].response_type == 'integer' || result.response[0].response_type == 'Numeric') && (result.response[1].response_type == 'Integer' || result.response[1].response_type == 'Numeric' || result.response[1].response_type == 'integer'))"></span>

                      <span htmldiff consider-null current="result.response[1].responseText | cleanhtml" previous="result.response[0].responseText" data-ng-if="((result.response[0].response_type == 'Grid') && result.response[1].response_type == 'Grid') || (result.response[0].response_type == 'DynamicGrid' && result.response[1].response_type == 'DynamicGrid') || result.response[1].response_type == 'TextMultiLine' || result.response[0].response_type == 'TextMultiLine'"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <!-- If trackChanges -->
            <!-- ************************************************************* -->
            <!-- If showScoreMap -->
            <!-- If trackChanges -->
            <div data-ng-if="vm.activeTab == 'showScoreMap' &&  vm.fundNames.length"
                 infinite-scroll="vm.getResponses()" infinite-scroll-parent infinite-scroll-container="'.scroll_container'" infinite-scroll-distance="1">
                 <div class="panel panel-default panel-compare" data-ng-repeat="result in vm.compareResponsesPaged">
                <div class="panel-heading">
                  <span ng-bind-html="result.questionText | trusthtml"></span>
                </div>
                <div class="panel-body">
                  <div class="dv-table dv-table-middle compare-dd-results">
                    <div class="cell compare-dd-results-responses text-center pos-rel"
                        data-ng-repeat="response in result.response"
                        data-ng-class="{'col-md-4': vm.fundNames.length == 3, 'col-md-6': vm.fundNames.length == 2, 'bordered-right': !$last}">
                      <small class="scoreAndFlagInTrackChanges">
                        <b data-ng-if="response.score && response.aggregate_score">
                          <dd-rated-score score="response.score"
                                        keep-watcher-on="true"
                                        rating-scale="vm.rating_scales"
                                        na-value="vm.naValue"
                                        total="response.aggregate_score"
                                        rating-value="response.rating"
                                        use-rating-value="true"
                                        ></dd-rated-score>
                        </b>
                        <b data-ng-if="!response.score || !response.aggregate_score">
                          <small class="text-muted">
                            <i>*N/A*</i>
                          </small>
                        </b>
                      </small>
                    </div>
                  </div>
                </div>
              </div>
            </div>

                  <th data-ng-repeat="fundName in vm.fundNames track by $index">

                <tr data-ng-repeat="result in vm.compareResults track by $index">

                        <i>*N/A*</i>
                      </small>
                    </b>
                  </td>
                </tr>
              </tbody>
              </table> -->

                 class="panel panel-default panel-compare scoreMap" data-ng-class="{'space-on-right-xl': vm.fundNames.length > 3}">
              <div class="panel-heading">
                <span ng-bind-html="result.questionText | cleanhtml"></span>
              </div>
              <div class="panel-body">

              </div>

            <!-- end showScoreMap -->

            <div col="6" offset="3" data-ng-show="vm.compareResults && !vm.compareResults.length && !vm.isLoading">
              <div class="panel panel-default">
                <div class="panel-body">
                  <empty-state icon-name="compare"
                               message="Nothing to compare on the selected due diligences"
                               action="vm.returnToDDList()"
                               action-label="Back to list"></empty-state>
                </div>
              </div>
            </div>
          </div>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</div>
