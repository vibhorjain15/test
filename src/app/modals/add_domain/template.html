<form name="vm.domain_form"
      data-ng-submit="vm.save()"
      class="form-horizontal" novalidate>
  <div class="modal-header">
    <h3 class="modal-title">Add Domain
      <a class="pull-right clickable link-disguise link-unstyled"
         data-ng-click="vm.cancel()">&times;</a>
    </h3>
  </div>

  <div class="modal-body">

    <form-group field-name="Domain">
        <label for="domainUrl" class="control-label col-sm-4" >
          Domain
        </label>

        <div class="col-sm-6" >
          <select id="column-type"
                  class="form-control"
                  chosen
                  required
                  data-ng-model="vm.domainObj.domain_name"
                  data-ng-options="domain as domain for domain in vm.domains">
              <option value=""></option>
          </select>
        </div>
    </form-group>
    <form-group field-name="SSO">
      <label for="domainUrl" class="control-label col-sm-4" >
        Enable
        <small uib-tooltip="Check here to auto-enable SSO for all users of this domain">
            <icon name="info"
                  class="text-info">
            </icon>
        </small>
      </label>
      <div class="col-sm-6">
        <dv-checkbox
          data-ng-model="vm.domainObj.is_sso_enabled"
          label="SSO">
        </dv-checkbox>
      </div>
    </form-group>
    <form-group field-name="Domain">
      <label for="domainUrl" class="control-label col-sm-4" >
        Enable
        <small uib-tooltip="Check here to enable auto user approval for this domain">
            <icon name="info"
                  class="text-info">
            </icon>
        </small>
      </label>
      <div class="col-sm-6">
        <dv-checkbox
          data-ng-model="vm.domainObj.is_auto_approve_enabled"
          label="Domain Whitelisting">
        </dv-checkbox>
      </div>
    </form-group>

  </div>

  <div class="modal-footer">
    <button type="submit"
            button-loader="vm.saving">Add Domain</button>
    <button btn-type="default" data-ng-click="vm.cancel()">Cancel</button>
  </div>
</form>
