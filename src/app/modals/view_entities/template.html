<div class="modal-header">
    <h3 class="modal-title">Viewing Selected {{vm.entityType}}(s)
        <a class="pull-right clickable link-disguise link-unstyled"
            data-ng-click="vm.cancel()">&times;</a>
    </h3>
</div>
<div class="modal-body">
    <ul class="list-group overflow-scroll-y-axis max-h-25-em">
        <li class="list-group-item" data-ng-repeat="entity in vm.entities">
            {{entity.display_name}}
        </li>
    </ul>
    <empty-state message="No {{vm.entityType}} selected"></empty-state>
</div>
