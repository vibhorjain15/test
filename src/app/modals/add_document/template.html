<form name="vm.add_document_form" data-ng-submit="vm.submit()" class="form-horizontal" novalidate>
  <div class="modal-header">
    <h3 class="modal-title">Add New Document(s) (Up to 10 files)
     <a class="pull-right clickable link-disguise link-unstyled"
         data-ng-click="vm.cancel()">&times;</a>
    </h3>
  </div>

  <div class="modal-body">
      <div class="row clearfix">
            <div col="12">
                <form-group field-name="Document Context" tooltip-placement="left">
                    <label for="document-name" class="col-md-4 control-label">
                        Document Context
                        <br>
                        <small class="text-muted">(Add a note to provide additional context / color)</small>
                    </label>

                    <div class="col-md-6">
                        <textarea rows="4"
                               id="document-name"
                               class="form-control"
                               data-ng-model="vm.params.context"
                               msd-elastic="\n"
                               dv-restrict-input="{type: 'avoidFirstSplCharacter'}"
                               required></textarea>
                    </div>
                </form-group>

                <form-group field-name="Document Source" tooltip-placement="left">
                    <label for="document-source" class="col-md-4 control-label">
                        Document Source
                    </label>

                    <div class="col-md-6">
                        <select id="document-source"
                                class="form-control"
                                chosen
                                data-ng-model="vm.params.source"
                                data-ng-options="source_obj.id as source_obj.value for source_obj in vm.sources_options"
                                required>
                            <option value="">--Select--</option>
                        </select>
                    </div>
                </form-group>

                <div class="dd-doc-selection-wrapper space-on-top-xxl">
                    <div class="panel panel-default dd-doc-drop-panel"
                         dv-file-handler
                         name="file-handler-one"
                         dv-fields="vm.params"
                         dv-droppable
                         dv-manual-upload
                         dv-aggregate-upload
                         ngf-multiple="true"
                         ngf-select-disabled="true"
                         dv-bind-files-to="vm.files"
                         ngf-max-files="5"
                         dv-accept="'.pdf'"
                         dv-pattern="'.pdf'"
                         dv-max-file-size="::vm.maxFileSize"
                         dv-upload-url="/attachments "
                         dv-on-upload="vm.getDocumentUploadResponse(response)"
                         dv-on-upload-error="vm.handleUploadError(response)"
                         ngf-drag-over-class="'panel-primary'">
                        <div class="panel-body">
                            <p class="text-muted text-center">
                                <strong>Drag & Drop your file here</strong>
                            </p>

                            <p class="text-muted text-center">
                                <icon name="upload" size="2x"></icon>
                            </p>
                        </div>
                    </div>

                    <div class="dd-doc-select-button-container">
                        <button btn-type="default"
                                dv-file-handler
                                name="file-handler-two"
                                dv-fields="vm.params"
                                dv-bind-files-to="vm.files"
                                dv-manual-upload
                                dv-aggregate-upload
                                dv-upload-url="/attachments "
                                ngf-max-files="10"
                                ngf-multiple="true"
                                dv-accept="'.pdf'"
                                dv-pattern="'.pdf'"
                                dv-max-file-size="::vm.maxFileSize"
                                dv-on-upload="vm.getDocumentUploadResponse(response)"
                                dv-on-upload-error="vm.handleUploadError(response)">
                            Select File
                        </button>
                    </div>
                </div>
                <div class="space-on-top-xxl" data-ng-if="vm.files.length>0">
                    <div class="space-on-bottom-lg" data-ng-repeat="file in vm.files">
                        <span class="space-on-right-lg">{{$index+1}}.</span>
                        <span dv-limit-word="file.name" char-limit="30"></span>
                        <button btn-type="default"
                                class="danger"
                                size="sm"
                                uib-tooltip="Delete File"
                                data-ng-click="vm.deleteFile($index)"><icon name="trashcan"></icon></button>
                    </div>
                </div>
                <br/>
            </div>
        </div>
      </div>

  <div class="modal-footer">
    <button type="submit" button-loader="vm.loading">Upload</button>
    <button btn-type="default" data-ng-click="vm.cancel()">Cancel</button>
  </div>
</form>
