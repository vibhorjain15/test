<form class="form-horizontal" name="vm.moveQuestion_form" novalidate data-ng-submit="vm.moveQuestion()">
  <div class="modal-header">
    <h3 class="modal-title">
        {{vm.entityType == 'questions'?'Move Question':'Move Subcategories'}}
      <a class="pull-right clickable link-disguise link-unstyled"
         data-ng-click="vm.cancel()">&times;</a>
    </h3>
  </div>

  <div class="modal-body overflow-scroll-y-axis h-80-vh">

    <form-group field-name="selectedQuestions" class="selectedListing">
      <label col="3" class="control-label">{{vm.entityType == 'questions'?'Selected Questions':'Selected Subcategories'}}</label>
      <div col="6">
        <ul class="list-group" data-ng-class="{'overflow-y-scroll': vm.selectedEntities.length > 5}">
          <li class="list-group-item" data-ng-repeat="entity in vm.selectedEntities">
            <span truncate-text="100">{{vm.entityType == 'questions'?entity.text:entity.name}}</span>
          </li>
        </ul>
      </div>
    </form-group>

    <spinner data-ng-show="vm.loading_sections">
    </spinner>

    <div class="section-selection" data-ng-if="vm.Utils.getObjectLength(vm.sections) > 0">
      <div class="search-area">
        <span>
          <input type="text" class="form-control" placeholder="Search categories/subcategories" data-ng-model="vm.searchSections" />
        </span>
      </div>

      <div class="section-list">
        <empty-state message="No categories/subcategories found." data-ng-show="filteredList.length == 0"></empty-state>
        <uib-accordion close-others="true">
          <div uib-accordion-group template-url="shared/templates/accordion-custom-template.html" is-open="section.isOpen" class="section" data-ng-repeat="section in filteredList = (vm.sections | orderObjectBy: 'order' | filter:vm.searchSections)">
              <uib-accordion-heading>
                <div class="header" data-ng-class="{'active':section.selected}">
                  <span data-ng-if="vm.entityType == 'subcategories'">
                    <dv-checkbox uib-tooltip="Current parent section" data-ng-if="vm.currentParent.id == section.id" class="inline-block" disabled data-ng-model="vm.currentParent.selected">
                    </dv-checkbox>
                    <dv-checkbox data-ng-if="vm.currentParent.id != section.id" class="inline-block" data-ng-model="section.selected" data-ng-change="vm.selectSection(section)">
                    </dv-checkbox>
                  </span>
                  <label class="padded-left-sm" truncate-text="150" data-ng-class="{'text-light-blue':vm.entityType == 'subcategories'}">{{section.name | uppercase}}</label>
                </div>
              </uib-accordion-heading>
              <div class="subsection padded-left" data-ng-repeat="subsection in section.sections">
                <span class="subsection-name">
                  <span data-ng-if="vm.entityType == 'questions'">
                    <dv-checkbox uib-tooltip="Current parent Subsection" data-ng-if="vm.currentParent.id == subsection.id" class="inline-block" disabled data-ng-model="vm.currentParent.selected">
                    </dv-checkbox>
                    <dv-checkbox data-ng-if="vm.currentParent.id != subsection.id" class="inline-block" data-ng-model="subsection.selected" data-ng-change="vm.selectSection(subsection)">
                    </dv-checkbox>
                  </span>
                  <label truncate-text="150" data-ng-class="{'text-light-blue':vm.entityType == 'questions'}">
                      {{subsection.name | uppercase}}
                  </label>
                  <span class="badge" data-ng-if="subsection.question_counts > 0">{{subsection.question_counts}}</span>
                </span>
              </div>
            </div>
        </uib-accordion>
      </div>
    </div>

  </div>

  <div class="modal-footer">
    <button btn-type="default" data-ng-if="vm.entityType == 'subcategories'" 
      button-loader="vm.moving" data-ng-click="vm.convertToCategory()">
        Convert to Category Instead
    </button>
    <button type="submit" button-loader="vm.saving" data-ng-disabled="vm.selectedEntity == null || !vm.selectedEntity.selected">
      {{vm.entityType == 'questions'?'Move Question':'Move Subcategories'}}
    </button>
    <button btn-type="default" data-ng-click="vm.cancel()">
            Cancel
    </button>
  </div>
</form>
