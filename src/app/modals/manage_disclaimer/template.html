<form class="form-horizontal" name="vm.disclaimer_form" novalidate data-ng-submit="vm.save()">
  <div class="modal-header">
    <h3 class="modal-title">
      {{vm.edit_mode ? 'Editing Disclaimer' : 'Add New Disclaimer'}}

      <a class="pull-right clickable link-disguise link-unstyled"
         data-ng-click="vm.cancel()">&times;</a>
    </h3>
  </div>

  <div class="modal-body">
    <form-group field-name="Name">
      <label for="street-name-1" class="control-label" col="3" col-type="sm">Name</label>

      <div col="9" col-type="sm">
        <input type="text"
               class="form-control"
               id="name"
               name="name"
               dv-restrict-input="{type: 'avoidFirstSplCharacter'}"
               data-ng-model="vm.params.name"
               required>
      </div>
    </form-group>

    <form-group field-name="Disclaimer Text">
      <label for="disclaimer-text" class="control-label" col="3" col-type="sm">Disclaimer Text</label>

      <div col="9" col-type="sm">
       <textarea id="disclaimer-text"
            ui-tinymce="vm.tinymceOptions"
            data-ng-model="vm.params.text"
            class="form-control"
            required></textarea>
      </div>
    </form-group>

  </div>

  <div class="modal-footer">
    <button type="submit" button-loader="vm.saving">{{vm.edit_mode ? 'Update Disclaimer' : 'Add Disclaimer'}}</button>
    <button btn-type="default"
                data-ng-click="vm.cancel()">Cancel</button>
  </div>
</form>
