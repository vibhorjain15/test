<div>
    <div class="modal-header">
      <h3 class="modal-title">Help: Project Review
        <a class="pull-right clickable link-disguise link-unstyled"
           data-ng-click="vm.cancel()">&times;</a>
      </h3>
    </div>
    <div class="modal-body">
      <img class="img-responsive" src="assets/images/review-help-section.png">
    </div>
  
    <div class="modal-footer">
      <button type="submit"
              data-ng-click="vm.dontShowAgain()"
              button-loader="vm.savingChoice">Don't Show Again</button>
      <button btn-type="default"
              data-ng-click="vm.cancel()">Close</button>
    </div>
</div>
