<div class="space-on-bottom-xxl">
    <!--<h4 class="space-on-top-xxl">Nested Questions</h4>
    <hr class="space-on-top">-->

    <div class="panel panel-default borderless">
        <div class="panel-heading">
            <h5 class="panel-title" ng-bind-html="question_item.question.attributes.text"></h5>
            <div class="panel-controls">
                <div class="panel-controls-wrapper">
                    <a class="panel-control"
                        data-ng-if="question_item.question.attributes.responseType == 'Grid'"
                        uib-tooltip="Configure Formulas"
                        data-ng-click="vm.addFormula(question_item.question)">
                            <icon name="formula" size="2x" data-ng-class="{'text-primary': question_item.question.attributes.has_formulas}"></icon>
                    </a>
                    <a class="panel-control"
                        uib-tooltip="{{question_item.question.attributes.editSectionOpened ? 'Cancel' : 'Edit Question'}}"
                        data-ng-click="vm.toggleQuestionEdit(question_item.question.attributes)">
                        <i class="dvi"
                           data-ng-class="{'dvi-pencil': !question_item.question.attributes.editSectionOpened, 'dvi-close': question_item.question.attributes.editSectionOpened}"></i>
                    </a>
                </div>
            </div>
        </div>
        <div data-ng-if="question_item.question.attributes.editSectionOpened">
            <template-question-builder on-save="vm.onSave(question_item.question.attributes)"
                                       template-id="vm.templateId"
                                       question-params="question_item.question.attributes"
                                       single-question-mode
                                       hide-panel-header
                                       edit-multiple-questions
                                       on-cancel="vm.toggleQuestionEdit(question_item.question.attributes)"
                                       on-error="vm.close()">
            </template-question-builder>
        </div>
    </div>
</div>

<ul class="nested-questions-list">
    <div ng-repeat="question_item in question_item.children" data-ng-include="vm.edit_question_tree_template"></div>
</ul>
