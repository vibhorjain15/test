<form class="form-horizontal" name="vm.view_sp" novalidate data-ng-submit="vm.submit()">
  <div class="modal-header">
    <h3 class="modal-title">Service Provider

      <a class="pull-right clickable link-disguise link-unstyled"
         data-ng-click="vm.cancel()">&times;</a>
    </h3>
  </div>
  <div class="modal-body">
    <form-group field-name="ACS">
      <label for="acs" class="control-label" col ="3" col-type="sm">Assertion consumer service</label>
      <div col="8" col-type="sm">
        <div class="sp_details_control">
          <p id="acs" uib-tooltip="{{vm.sp_data.acs_url}}" >{{vm.sp_data.acs_url}}</p>
        </div>
      </div>
      <div col="1">
        <button btn-type="default"
                size="sm"
                class="space-on-left-lg space-on-top"
                uib-tooltip="Copy"
                ngclipboard data-clipboard-target="#acs">
            <icon name="copy"></icon>
        </button>
      </div>
    </form-group>
    <form-group field-name="Audience">
      <label for="acs" class="control-label" col ="3" col-type="sm">SAML Audience</label>
      <div col="8" col-type="sm">
        <div class="sp_details_control">
          <p id="saml" uib-tooltip="{{vm.sp_data.audience}}" >{{vm.sp_data.audience}}</p>
        </div>
      </div>
      <div col="1">
        <button btn-type="default"
                size="sm"
                class="space-on-left-lg space-on-top"
                uib-tooltip="Copy"
                ngclipboard data-clipboard-target="#saml">
            <icon name="copy"></icon>
        </button>
      </div>
    </form-group>
    <form-group field-name="ACS">
      <label for="acs" class="control-label" col ="3" col-type="sm">Single Logout Service Url</label>
      <div col="8" col-type="sm">
        <div class="sp_details_control">
          <p id="url" uib-tooltip="{{vm.sp_data.logout_url}}" >{{vm.sp_data.logout_url}}</p>
        </div>
      </div>
      <div col="1">
        <button btn-type="default"
                size="sm"
                class="space-on-left-lg space-on-top"
                uib-tooltip="Copy"
                data-ng-if="vm.sp_data.logout_url"
                ngclipboard data-clipboard-target="#url">
            <icon name="copy"></icon>
        </button>
      </div>
    </form-group>
  </div>
</form>
