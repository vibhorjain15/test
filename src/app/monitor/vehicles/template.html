<div data-ng-if="vm.Utils.isAngular()">
   <ng2-manage-vehicles></ng2-manage-vehicles>
</div>
<div data-ng-if="vm.Utils.isAngularJS()" class="panel panel-default">
   <div class="panel-heading">
      <h5 class="panel-title">
         Monitor Vehicles
      </h5>
      <div class="panel-controls">
         <div class="panel-controls-wrapper">
            <a class="panel-control full-height" data-ng-if="vm.filters_data_loaded" uib-tooltip="Apply Filters"
               data-ng-click="vm.toggleFiltersSection()">
               <icon name="filter" data-ng-class="{'text-orange': vm.filterApplied}"></icon>
            </a>
            <a class="panel-control full-height" data-ng-click="vm.resetFiltersData()" uib-tooltip="Clear Filters"
               data-ng-if="vm.filterApplied">
               <icon name="refresh"></icon>
            </a>
            <a class="panel-control" data-ng-class="{'route-link-disabled':vm.isFreeInvestor}" data-ng-click="vm.openNewVehicleDialog()" uib-tooltip="{{vm.isFreeInvestor?'This feature is available for premium users.':'Add New vehicle'}}">
               <icon name="plus"></icon>
            </a>
         </div>
      </div>
   </div>
   <div class="panel-body">
      <div class="label-list space-on-bottom-lg" data-ng-if="vm.filterApplied">
         <span class="btn btn-primary-outline text-uppercase space-on-right space-on-top"
            data-ng-repeat="criterion in vm.search_criterias" data-ng-if="criterion.advance_filter_value">
            <small>{{vm.displayFilter(criterion)}}</small>
            <a class="space-on-left clickable link-disguise" data-ng-click="vm.removeFilterCriterion($index)">&times;</a>
         </span>
      </div>
      <spinner broad-spinner spinner-height='60' data-ng-if="!vm.vehicles || vm.loading"></spinner>
      <div data-ng-if="vm.vehicles && !vm.loading">
         <dv-grid grid-resource="vm.vehicles" dynamic-grid-columns="vm.dynamicGridColumns" grid-name="'vehicles'"></dv-grid>
      </div>
   </div>
</div>
