<div data-ng-if="vm.Utils.isAngular()">
  <ng2-meetings-detail></ng2-meetings-detail>
</div>
<div data-ng-if="vm.Utils.isAngularJS()" class="row clearfix">
  <div class="col-md-12">
    <div class="panel panel-default borderless-top hide-in-print-view">
      <div class="panel-body clearfix">
          <spinner broad-spinner spinner-height='65' data-ng-if="!vm.meeting"></spinner>

        <div class="dv-table dv-table-middle dd-info-panel"
             data-ng-show="vm.meeting">
          <div class="bordered-right cell">
            <h4 class="clear-margin max-w-320 lh1-5 word-break-break-all">
              {{vm.meeting.name}}
            </h4>
          </div>

          <div class="cell bordered-right">
             At {{vm.localtime | date}} from {{vm.event_start_time}} to {{vm.event_end_time}}
          </div>

          <div class="cell">
            <span class="pull-right" uib-dropdown>
               <a href="" class="dropdown-toggle btn btn-transparent"
                  uib-dropdown-toggle
                  uib-tooltip="Add documents, edit meeting">
                   <div><icon name="ellipsis-h" size="2x"></icon></div>
                   <div class="space-on-top-n"><small>More Actions</small></div>
               </a>

              <ul class="dropdown-menu" uib-dropdown-menu role="menu">
                  <li>
                      <a data-ng-click="vm.openUploadDocumentModal()" role="button"><icon name="file" class="space-on-right-lg"></icon>Add Documents</a>
                  </li>
                  <li>
                      <a data-ng-click="vm.editMeeting()" role="button"><icon name="pencil" class="space-on-right-lg"></icon>Edit Meeting</a>
                  </li>
                  <li>
                      <a class="text-danger" data-ng-click="vm.deleteMeeting()" role="button"><icon name="trashcan" class="space-on-right-lg"></icon>Delete Meeting</a>
                  </li>
              </ul>
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="row clearfix">
      <div col="4" class="hide-in-print-view">
          <dv-documents entity-type="vm.entity_type" entity-id="vm.meetingId"></dv-documents>
      </div>

      <div col="8">
        <dv-notes entity-type="vm.entity_type" entity-id="vm.meetingId" notes-options="vm.notesOptions" entity-name="vm.meeting.name"></dv-notes>
      </div>

    </div>
  </div>

</div>
