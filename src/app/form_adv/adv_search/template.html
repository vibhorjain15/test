<div data-ng-if="vm.Utils.isAngular()">
  <ng2-adv-search></ng2-adv-search>
</div>
<div data-ng-if="vm.Utils.isAngularJS()" class="panel panel-default report-panel js-search-panel search-string-panel pos-rel">
  <spinner broad-spinner spinner-height='50' data-ng-if="vm.loading_data"></spinner>
  <div class="panel-heading clearfix" data-ng-if="!vm.loading_data">
    <div class="content-wrapper">
      <div class="content-block" col="2">
        <div class="text-center">
          <div class="btn-group">
            <!-- <label class="btn btn-default font-size-12"
              data-ng-class="{'btn-primary': vm.activeView.toLowerCase()== vm.activeViews.SERVICE_PROVIDER,'disabled':vm.is_freeSubscription}"
              uib-tooltip="{{vm.is_freeSubscription?vm.errorMessageMap.freeUserMessage:''}}"
              data-ng-click="vm.setActiveView(vm.activeViews.SERVICE_PROVIDER);vm.clearGridState()">Service Provider</label> -->
            <label class="btn btn-default font-size-12" data-ng-class="{'btn-primary': vm.activeView.toLowerCase() == vm.activeViews.FUND,'disabled':vm.is_freeSubscription}"
              uib-tooltip="{{vm.is_freeSubscription?vm.errorMessageMap.freeUserMessage:''}}"
              data-ng-click="vm.setActiveView(vm.activeViews.FUND);vm.clearGridState()">Fund</label>
            <label class="btn btn-default font-size-12" data-ng-class="{'btn-primary': vm.activeView.toLowerCase()== vm.activeViews.FIRM}"
              data-ng-click="vm.setActiveView(vm.activeViews.FIRM);vm.clearGridState()">Firm</label>
          </div>
        </div>
      </div>
      <div col="7" class="text-center">
        <form name="vm.searchForm" data-ng-submit="vm.searchByEntity()">
          <div class="input-group" uib-tooltip="{{vm.is_freeSubscription?vm.errorMessageMap.freeUserMessage:''}}">
            <input type="text" class="form-control"
              placeholder="Search for {{vm.activeView == 'fund'? 'Funds' : vm.activeView == 'service_provider'? 'SP': 'Firms'}} or use filters for more search options like brochure text, fund type etc"
              data-ng-model="vm.entity_search_text"
              data-ng-disabled="vm.is_freeSubscription">
            <div class="input-group-btn">
              <button class="btn btn-default" data-ng-click="vm.clearSearchText()" data-ng-disabled="vm.is_freeSubscription"
                data-ng-show="vm.showingSearchResults && vm.entity_search_text">
                <icon name="close"></icon>
              </button>
              <button type="submit" class="btn btn-default" data-ng-disabled="vm.is_freeSubscription">
                <icon name="search"></icon>
              </button>
            </div>
          </div>
        </form>
      </div>
      <div col="1">
        <button type="button" class="btn btn-default" data-ng-disabled="vm.is_freeSubscription" uib-tooltip="Reset" data-ng-click="vm.resetFilters()">
          <icon name="refresh"></icon>
        </button>
      </div>
      <div class="advanceAdvSearch" col="2">
        <div class="space-on-top" data-ng-if="vm.isSearchPanelCollapsed">
          <a class="clickable va-middle" data-ng-click="vm.toggleSearchPanel()">Search with Filters</a>
        </div>
        <div class="pull-right space-on-top clickable" uib-tooltip="Hide Search with Filters"
          data-ng-if="!vm.isSearchPanelCollapsed" data-ng-click="vm.toggleSearchPanel()">
          <button btn-type="default">
            <icon name="chevron-up"></icon>
          </button>
        </div>
      </div>
    </div>
    <div col="12">
      <form class="form-horizontal" name="vm.search_form" novalidate data-ng-submit="vm.searchByFilters()"
        uib-collapse="vm.isSearchPanelCollapsed">
        <div class="space-on-bottom-lg space-on-top-lg">
          <div col="12" class="space-on-bottom-lg">
            <div offset="1" col="11" class="">
              <label
                class="control-label clear-margin-bottom inline-block space-on-right">{{vm.activeView == 'fund'? 'Funds' : vm.activeView == 'service_provider'? 'SP' : 'Firms'}}
                matching</label>
              <select class="form-control inline-block w-80" required data-ng-model="vm.global_ternary_operator"
                data-ng-change="vm.globalOperatorChanged(vm.global_ternary_operator)">
                <option value="{{vm.FILTER_TERNARY_OPERATORS.OR}}">ANY</option>
                <option value="{{vm.FILTER_TERNARY_OPERATORS.AND}}">ALL</option>
              </select>
              <label class="control-label clear-margin-bottom inline-block space-on-left">of the following
                criteria</label>
            </div>
          </div>

          <div col="12" class="space-on-top-xl" data-ng-repeat="criteria in vm.search_criterias track by $index">
            <div col="1" class="pa-lr-lg">
              <label class="control-label" data-ng-if="$index==0">&nbsp;</label>
              <h5 class="text-right clear-margin-bottom text-uppercase" data-ng-if="$index>0">
                {{vm.global_ternary_operator}}</h5>
            </div>
            <div col="6" class="pa-lr-lg">
              <form-group field-name="Criteria" tooltip-placement="left">
                <label for="criteria_{{$index}}" class="control-label text-capitalize"
                  data-ng-show="$index==0">Filters</label>
                <select class="form-control" id="criteria_{{$index}}" name="criteria_{{$index}}" chosen required
                  data-ng-model="criteria.criteria_obj" data-placeholder="Select a criteria"
                  data-ng-change="vm.selectCriteria(criteria, $index)"
                  data-ng-options="option as option.filter_label for option in vm.criteria_options">
                  <option value=""></option>
                </select>
              </form-group>
            </div>
            <div col="2" class="pa-lr-lg">
              <label class="control-label" data-ng-if="$index == 0">Condition</label>
              <form-group field-name="condition" tooltip-placement="left">
                <select class="form-control" required data-ng-model="criteria.condition">
                  <option value="" disabled selected hidden>Select condition</option>
                  <option
                    data-ng-if="criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.NUMBER || criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.DATE"
                    value="gt">Greater than</option>
                  <option
                    data-ng-if="criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.NUMBER || criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.DATE"
                    value="lt">Smaller than</option>
                  <option data-ng-if="criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.DATE" value="between">Between
                  </option>
                  <option data-ng-if="criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.DATE" value="gte">Greater
                    than
                    Equals to</option>
                  <option data-ng-if="criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.DATE" value="lte">Lesser than
                    Equals to</option>
                  <option data-ng-if="criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.STRING" value="phrase">Contains
                  </option>
                  <option value="exact" data-ng-if="criteria.criteria_obj.filter_type.toLowerCase() != vm.FILTER_TYPES.DATE && criteria.criteria_obj.filter_type.toLowerCase() != vm.FILTER_TYPES.NUMBER">Equals
                  </option>
                </select>
              </form-group>
            </div>

            <div col="3" class="pa-lr-lg">
              <form-group field-name="Value" data-ng-if="!criteria.criteria_obj.filter_type" tooltip-placement="left">
                <label for="value_{{$index}}" class="control-label" data-ng-show="$index==0">Value</label>
                <input type="text" data-ng-model="criteria.advance_filter_value" required placeholder="Type a value"
                  dv-restrict-input="{type: 'avoidFirstSplCharacter'}" class="form-control" />
              </form-group>
              <form-group field-name="Value" data-ng-if="criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.NUMBER"
                tooltip-placement="left">
                <label for="value_{{$index}}" class="control-label" data-ng-show="$index==0">Value</label>
                <input type="number" data-ng-model="criteria.advance_filter_value" class="form-control" required />
              </form-group>
              <form-group field-name="Value"
                data-ng-if="criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.STRING && !criteria.criteria_obj.filter_value"
                tooltip-placement="left">
                <label for="value_{{$index}}" class="control-label" data-ng-show="$index==0">Value</label>
                <input type="text" id="value_{{$index}}" data-ng-model="criteria.advance_filter_value"
                  data-ng-required="true" placeholder="Type a value"
                  dv-restrict-input="{type: 'avoidFirstSplCharacter'}" class="form-control" />
              </form-group>
              <form-group field-name="Value"
                data-ng-if="(criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.STRING || criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.RANGE) && criteria.criteria_obj.filter_value"
                tooltip-placement="left">
                <label for="value_{{$index}}" class="control-label" data-ng-show="$index==0">Value</label>
                <select class="form-control" id="value_{{$index}}" data-ng-show="" chosen data-ng-required="true"
                  data-ng-model="criteria.advance_filter_value"
                  data-ng-options="option as option for option in criteria.criteria_obj.filter_value">
                  <option value=""></option>
                </select>
              </form-group>
              <form-group field-name="Value"
                data-ng-if="criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.DATE && criteria.condition == 'between'"
                control-selector="dv-daterangepicker">
                <label class="control-label" data-ng-show="$index==0">Value</label>
                <div col="12">
                  <dv-daterangepicker data-ng-model="criteria.advance_filter_value" name="daterangefilter_{{$index}}"
                    min-date="vm.minDate" max-date="vm.maxDate" apply-method="vm.applyMethod" required>
                  </dv-daterangepicker>
                </div>
              </form-group>
              <form-group field-name="Value"
                data-ng-if="criteria.criteria_obj.filter_type.toLowerCase() == vm.FILTER_TYPES.DATE && criteria.condition != 'between'"
                control-selector="dv-datepicker">
                <label class="control-label" data-ng-show="$index==0">Value</label>
                <dv-datepicker data-ng-model="criteria.advance_filter_value" name="datefilter_{{$index}}"
                  data-ng-change="vm.setModelValidity()" ng-required="true"></dv-datepicker>
              </form-group>

            </div>
          </div>

          <div col="12" class="space-on-top-xxl">

            <div offset="10" col="2" class="">
              <div class="pull-right">
                <button btn-type="default" size="sm" class="space-on-right" uib-tooltip="Add Criteria"
                  data-ng-click="vm.addNewCriteria()">
                  <icon name="plus"></icon>
                </button>

                <button btn-type="default" data-ng-disabled="vm.search_criterias.length<2" size="sm"
                  uib-tooltip="Remove Criteria" data-ng-click="vm.removeCriteria()">
                  <icon name="minus"></icon>
                </button>
              </div>
            </div>

          </div>

          <div col="12" class="space-on-bottom-xl">
            <div offset="1" col="4" class="">
              <button type="submit" btn-type="primary" class="space-on-right-lg"  uib-tooltip="{{vm.is_freeSubscription?vm.errorMessageMap.freeUserMessage:'Start Searching'}}" data-ng-class="{'disabled': vm.is_freeSubscription}">
                <icon name="search" class="space-on-right"></icon>
                Start Searching
              </button>

              <button btn-type="default" data-ng-click="vm.clearFilters()">
                <icon name="refresh" class="space-on-right"></icon>
                Reset Filters
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="panel-body">
    <div data-ng-if="vm.advanceAdvSearch && vm.isSearchPanelCollapsed" class="label-list space-on-bottom-lg">
      <span class="btn btn-primary-outline text-uppercase space-on-right"
        data-ng-repeat="criterion in vm.search_criterias">
        <small>{{vm.displayFilter(criterion)}}</small>

        <a class="space-on-left clickable link-disguise" data-ng-click="vm.removeFilterCriterion($index)">&times;</a>
      </span>
    </div>
    <div class="space-on-bottom-lg" data-ng-if="vm.showCount()">
      <p class="alert bordered-navy-blue">
        Showing <span class="bold-underline">{{vm.recordsCount}}</span> of total <span class="bold-underline">{{vm.totalRecordsCount}}</span> Results.
      </p>
    </div>

    <div data-ng-if="vm.FormAdvData">
      <dv-grid grid-resource="vm.FormAdvData" name="vm.FormAdvData_grid" grid-name="'formadv-search'"></dv-grid>
    </div>
  </div>
</div>
