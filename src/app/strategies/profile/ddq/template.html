<div data-ng-if="vm.Utils.isAngular()">
  <ng2-strategy-ddq></ng2-strategy-ddq>
</div>
<div data-ng-if="vm.Utils.isAngularJS()" class="row clearfix">
  <div class="col-md-12">
    <div class="panel panel-default borderless-top">
      <div class="panel-body clearfix">
        <spinner broad-spinner spinner-height='65' data-ng-if="!vm.strategy"></spinner>

        <div class="dv-table dv-table-middle dd-info-panel"
             data-ng-show="vm.strategy">
          <div class="bordered-right cell">
            <h4 class="clear-margin max-w-320 lh1-5 word-break-break-all">
              {{vm.strategy.display_name}}
            </h4>
          </div>

          <div class="cell">
            <p class="alert alert-info">
              <small>
                Easily access or create new strategy level investor requests, standard DDQs, and pre-approved projects here. If you have shared DDQs with investors, you will be able to track their views / activities here.
              </small>
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="row clearfix">
      <div col="4" data-ng-class="">
        <strategy-ddqs ddqs="vm.investorDdqs" modal-open="vm.invokeAddInvestorDDQDialog()"
                    modal-title="'Investor Requests'"
                    ddq-type="'investor'"
                    help-text="'For RFP and investor relations teams to respond to or set up and manage inbound investor requests.'"
                    empty-state-message="'No investor requests available for this '+vm.entity_type+'. Please add'"></strategy-ddqs>
      </div>
      <div col="4" data-ng-class="">
        <strategy-ddqs ddqs="vm.ddqs" modal-open="vm.invokeAddDDQDialog()"
                  modal-title="'Standard DDQs'"
                  help-text="'For your team to maintain historical and current annual and quarterly DDQs at the strategy level. You can create new versions, update content, and then share with your investors.'"
                  empty-state-message="'No internal / standard DDQ available for this '+vm.entity_type+'. Please add'"></strategy-ddqs>
      </div>
      <div col="4" data-ng-class="" authorized-view accessible-to="manager">
        <profile-ddq ddqs="vm.profileddqs" modal-open="vm.invokeAddProfileDDQDialog()"
                    help-text="'For SMEs to build and maintain your firm’s Q/A content library with the most recent and up-to-date responses for use in investor requests and standard DDQs. Updates here will reflect in your Q/A Bank.'"
                    tooltip-text="'Build and maintain your firm’s Q/A content library with compliant and up-to-date responses for use in investor requests and standard DDQs. Updates here will reflect in your Q/A Bank. Pro tip: It is best practice for SMEs to regularly review this content and treat these responses as your one source of truth.'"
                    empty-state-message="'No Q/A Library Content available for this '+vm.entity_type+'. Please add'"></profile-ddq>
      </div>
    </div>
  </div>
</div>
